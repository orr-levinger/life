<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Life</title>
<style>
  :root {
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --muted: #52514e; --grid: #e4e3df; --warn: #b3261e;
    --learning: #2a78d6; --instinct: #eb6834; --inborn: #1baf7a; --rules: #eda100; --random: #e87ba4; --other: #8a8983;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --muted: #c3c2b7; --grid: #2e2e2b; --warn: #f2b8b5;
      --learning: #3987e5; --instinct: #d95926; --inborn: #199e70; --rules: #c98500; --random: #d55181; --other: #8a8983;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--page); color: var(--ink);
         font: 14px/1.4 system-ui, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; margin-bottom: 12px; }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }
  button, select, input { font: inherit; color: inherit; }
  .seg { display: inline-flex; gap: 2px; border: 1px solid var(--grid); border-radius: 7px; padding: 2px; }
  .seg button { background: none; border: 0; border-radius: 5px; padding: 3px 12px; cursor: pointer; color: var(--muted); }
  .seg button.on { background: var(--ink); color: var(--page); font-weight: 600; }
  .act { background: var(--surface); border: 1px solid var(--muted); border-radius: 7px; padding: 4px 14px; cursor: pointer; }
  .act:disabled { opacity: 0.5; cursor: default; }
  .act.stop { border-color: var(--warn); color: var(--warn); }
  #legend { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); }
  .swatch { display: inline-block; width: 18px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
  #clock { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--inborn); margin-right: 6px; }
  .dot.stale { background: var(--muted); }
  #start { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; background: var(--surface);
           border: 1px solid var(--grid); border-radius: 8px; padding: 8px 10px; margin-bottom: 12px; }
  #start b { font-weight: 600; }
  #start input, #start select { background: var(--page); border: 1px solid var(--grid); border-radius: 6px; padding: 3px 6px; }
  #start input { width: 70px; }
  .error { color: var(--warn); font-size: 12px; }
  #worlds { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 12px; margin-bottom: 12px; }
  .world { background: var(--surface); border: 1px solid var(--grid); border-radius: 8px; padding: 10px 12px; }
  .world .top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .world .top b { font-weight: 600; margin-right: auto; }
  .world .where { color: var(--muted); font-size: 12px; margin: 4px 0 8px; font-variant-numeric: tabular-nums; }
  .knob { display: grid; grid-template-columns: 1fr auto; gap: 0 8px; margin: 6px 0; }
  .knob label { font-size: 12px; }
  .knob output { font-size: 12px; font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }
  .knob input[type=range] { grid-column: 1 / -1; width: 100%; margin: 2px 0 0; accent-color: var(--ink); }
  .knob small { grid-column: 1 / -1; color: var(--muted); font-size: 11px; display: flex; justify-content: space-between; }
  .knob input:disabled { opacity: 0.55; }
  .switch { display: flex; align-items: center; gap: 8px; font-size: 12px; margin-top: 8px; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
  #runs { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 8px; margin-bottom: 12px; }
  .run { background: var(--surface); border: 1px solid var(--grid); border-radius: 8px; padding: 8px 10px;
         font: inherit; color: inherit; text-align: left; cursor: pointer; }
  .run.picked { border-color: var(--ink); }
  .run b { font-weight: 600; }
  .run div { color: var(--muted); font-size: 12px; margin-top: 2px; }
  #charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 12px; }
  .panel { background: var(--surface); border: 1px solid var(--grid); border-radius: 8px; padding: 12px 12px 6px; position: relative; }
  .panel h2 { font-size: 13px; margin: 0 0 4px; font-weight: 600; }
  .panel p { margin: 0 0 4px; font-size: 12px; color: var(--muted); }
  svg { width: 100%; height: 250px; display: block; }
  svg text { fill: var(--muted); font-size: 11px; }
  svg text.end { fill: var(--ink); font-size: 12px; }
  .tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--muted);
         border-radius: 6px; padding: 6px 8px; font-size: 12px; white-space: nowrap; display: none; z-index: 2; }
  .tip div { display: flex; justify-content: space-between; gap: 14px; }
  .tip .change { display: block; color: var(--muted); }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  .nothing { grid-column: 1 / -1; padding: 50px 0; text-align: center; color: var(--muted); }
  .nothing b { display: block; font-size: 22px; font-weight: 600; color: var(--ink); margin-bottom: 8px; }
  [hidden] { display: none !important; }
  @media (max-width: 480px) { #charts, #worlds { grid-template-columns: 1fr; } body { padding: 10px; } }
</style>
</head>
<body>
<header>
  <h1>Life</h1>
  <div class="seg">
    <button id="tab-live" type="button">Live</button>
    <button id="tab-history" type="button">History</button>
  </div>
  <div id="legend"></div>
  <div id="clock"><i class="dot stale"></i>connecting…</div>
</header>

<section id="start">
  <b>Start a world</b>
  <select id="start-species" aria-label="Animals">
    <option value="learning">learning animals</option>
    <option value="instinct">instinct animals</option>
  </select>
  <label>seed <input id="start-seed" type="number" min="0" step="1" value="1"></label>
  <div class="seg" id="start-mode">
    <button type="button" data-mode="auto" class="on">Auto</button>
    <button type="button" data-mode="manual">Manual</button>
  </div>
  <button id="start-go" class="act" type="button">Start</button>
  <span id="start-error" class="error"></span>
</section>
<div id="worlds"></div>
<div id="runs"></div>
<div id="charts"></div>

<script>
const PANELS = [
  { key: "level", title: "Difficulty", step: true,
    note: "How many 5 % nudges harder than the easy start the world is (below 0: easier). Whoever survives a harder world is smarter." },
  { key: "intelligence", title: "Intelligence: energy earned ÷ energy spent, in the test",
    note: "Every 2,000 steps up to 20 creatures take the same fixed test. Above 1 = they gain more energy than they burn. Dashed: random wanderers in the same test.",
    beside: { key: "wanderers", label: "wanderers" } },
  { key: "energy_percent", title: "Average energy per creature (% of a full tank)",
    note: "How well fed the creatures are.", refs: [[70, "has a baby"], [30, "below this, the old die"]] },
  { key: "population", title: "Creatures alive" },
  { key: "efficiency", title: "Energy earned ÷ energy spent, in the living world",
    note: "The same measure in the world they live in. It drops when the world gets harder and climbs as they get smarter.",
    refs: [[1, "breaks even"]] },
  { key: "deaths", title: "Deaths per 1,000 steps", note: "Only creatures with low energy die." },
  { key: "toward_food", title: "Steering to food", note: "When a creature sees food and moves: 1 = straight at it, 0 = random.", refs: [[0, "random"]] },
  { key: "generation", title: "Deepest generation alive", note: "How many parent-to-baby steps separate the newest creatures from the first ones." },
  { key: "bites_per_creature_step", title: "Bites per creature per step" },
];
const W = 520, H = 250, M = { l: 44, r: 108, t: 10, b: 30 };
const PENDING_FOR = 20000;  // ms a value moved by hand is shown before the world's own row must confirm it
let data = [], lastChange = 0, signature = "", picked = null, KNOBS = [], startMode = "auto";
let view = location.hash === "#history" ? "history" : "live";
const cards = new Map();  // a running world's controls, kept between polls so a drag is never interrupted

const colorOf = (kind) => {
  for (const [prefix, name] of [["learning-inborn", "inborn"], ["learning", "learning"], ["instinct", "instinct"],
                                ["rules", "rules"], ["random", "random"]]) if (kind.startsWith(prefix)) return `var(--${name})`;
  return "var(--other)";
};
const el = (tag, attrs = {}, text) => {
  const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  if (text !== undefined) node.textContent = text;
  return node;
};
const fmt = (v) => v === null || v === undefined ? "-" : Number.isInteger(v) ? String(v) : Math.abs(v) >= 10 ? v.toFixed(0) : v.toFixed(2);
const knobFmt = (v) => Math.abs(v) >= 100 ? Math.round(v).toLocaleString() : Math.abs(v) >= 10 ? v.toFixed(1) : v.toFixed(Math.abs(v) >= 1 ? 2 : 3);
const thousands = (steps) => `${Math.round(steps / 1000)}k`;
const lastRow = (run) => run.rows[run.rows.length - 1];
const swatch = (kind) => `<i class="swatch" style="background:${colorOf(kind)}"></i>`;
const say = (node, text, kind) => { node.textContent = text; node.dataset.kind = kind; };

async function send(path, body) {
  const response = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const answer = await response.json();
  if (!response.ok) throw new Error(answer.error || `refused (${response.status})`);
  return answer;
}

// What changed from one row to the next, and who changed it.
function changes(run) {
  const found = [];
  for (let i = 1; i < run.rows.length; i++) {
    const before = run.rows[i - 1], after = run.rows[i], what = [];
    for (const knob of KNOBS) {
      const a = before[knob.name], b = after[knob.name];
      if (a !== null && b !== null && Math.abs(a - b) > 1e-9 * Math.max(1, Math.abs(a))) what.push(`${knob.label} ${knobFmt(a)} → ${knobFmt(b)}`);
    }
    if (before.hunters !== after.hunters) what.push(`hunters ${after.hunters ? "on" : "off"}`);
    if (what.length) found.push({ step: after.step, color: colorOf(run.kind), text: `${what.join(", ")}, by ${after.manual ? "you" : "Auto"}` });
  }
  return found;
}

function meanLine(runs, key) {
  const byStep = new Map();
  for (const run of runs) for (const row of run.rows) {
    if (row[key] === null) continue;
    if (!byStep.has(row.step)) byStep.set(row.step, []);
    byStep.get(row.step).push(row[key]);
  }
  return [...byStep.entries()].sort((a, b) => a[0] - b[0]).map(([x, ys]) => [x, ys.reduce((s, y) => s + y, 0) / ys.length]);
}

function niceTicks(lo, hi, n = 5) {
  if (lo === hi) { lo -= 1; hi += 1; }  // a flat line still gets a readable axis
  const raw = (hi - lo) / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= raw);
  const ticks = [];
  for (let t = Math.floor(lo / step) * step; t <= hi + step * 0.5; t += step) ticks.push(+t.toFixed(10));
  return ticks;
}
// A tick label with just enough decimals that neighbouring ticks never read the same.
const tickLabel = (t, ticks) => t.toFixed((String(+(ticks[1] - ticks[0]).toFixed(6)).split(".")[1] || "").length);

function drawPanel(panel, kinds, xMax, marks) {
  const box = document.createElement("div");
  box.className = "panel";
  box.innerHTML = `<h2>${panel.title}</h2>` + (panel.note ? `<p>${panel.note}</p>` : "");
  const lines = kinds.map(([kind, runs]) => ({
    name: kind, color: colorOf(kind), mean: meanLine(runs, panel.key),
    seeds: runs.map((r) => r.rows.filter((row) => row[panel.key] !== null).map((row) => [row.step, row[panel.key]])),
  })).filter((l) => l.mean.length);
  if (!lines.length) { box.insertAdjacentHTML("beforeend", '<div class="empty">no data yet</div>'); return box; }
  if (panel.beside) {  // the yardstick drawn beside the creatures' own line
    const mean = meanLine(kinds.flatMap(([, runs]) => runs), panel.beside.key);
    if (mean.length) lines.push({ name: panel.beside.label, color: "var(--muted)", mean, seeds: [mean], dashed: true });
  }
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": panel.title });
  const tip = document.createElement("div");
  tip.className = "tip";
  box.append(svg, tip);

  const refs = panel.refs || [];
  const ys = lines.flatMap((l) => l.seeds.flat().map((p) => p[1])).concat(refs.map((r) => r[0]));
  const ticks = niceTicks(Math.min(...ys), Math.max(...ys));
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const px = (x) => M.l + (x / xMax) * (W - M.l - M.r);
  const py = (y) => H - M.b - ((y - y0) / (y1 - y0)) * (H - M.t - M.b);
  const path = (pts) => pts.map(([x, y], i) => {
    if (panel.step && i) return `H${px(x).toFixed(1)}V${py(y).toFixed(1)}`;
    return `${i ? "L" : "M"}${px(x).toFixed(1)},${py(y).toFixed(1)}`;
  }).join("");

  for (const t of ticks) {
    svg.append(el("line", { x1: M.l, x2: W - M.r, y1: py(t), y2: py(t), stroke: "var(--grid)" }));
    svg.append(el("text", { x: M.l - 6, y: py(t) + 4, "text-anchor": "end" }, tickLabel(t, ticks)));
  }
  for (let k = 0; k <= 5; k++) {
    const x = (xMax / 5) * k;
    svg.append(el("text", { x: px(x), y: H - M.b + 16, "text-anchor": "middle" }, `${(x / 1000).toFixed(xMax < 10000 ? 1 : 0)}k`));
  }
  for (const mark of marks)  // a knob changed here
    svg.append(el("line", { x1: px(mark.step), x2: px(mark.step), y1: M.t, y2: H - M.b, stroke: mark.color, "stroke-width": 1, opacity: 0.35 }));
  for (const [value, label] of refs) {
    svg.append(el("line", { x1: M.l, x2: W - M.r, y1: py(value), y2: py(value), stroke: "var(--muted)", "stroke-dasharray": "2 4" }));
    svg.append(el("text", { x: M.l + 4, y: py(value) - 4 }, label));
  }
  for (const line of lines) {
    if (!line.dashed && line.seeds.length > 1) for (const seed of line.seeds) if (seed.length)
      svg.append(el("path", { d: path(seed), fill: "none", stroke: line.color, "stroke-width": 1, opacity: 0.3 }));
    const stroke = { d: path(line.mean), fill: "none", stroke: line.color, "stroke-width": 2, "stroke-linejoin": "round" };
    if (line.dashed) stroke["stroke-dasharray"] = "6 4";
    svg.append(el("path", stroke));
  }
  const ends = lines.map((l) => ({ line: l, x: l.mean[l.mean.length - 1][0], y: l.mean[l.mean.length - 1][1] }))
    .sort((a, b) => py(a.y) - py(b.y));
  let lastY = -Infinity;
  for (const end of ends) {  // direct labels at the line ends, nudged apart
    const y = Math.max(py(end.y) + 4, lastY + 14);
    lastY = y;
    svg.append(el("circle", { cx: px(end.x), cy: py(end.y), r: 3.5, fill: end.line.color, stroke: "var(--surface)", "stroke-width": 2 }));
    svg.append(el("text", { x: px(end.x) + 8, y, class: "end" }, `${end.line.name} ${fmt(end.y)}`));
  }

  const cross = el("line", { y1: M.t, y2: H - M.b, stroke: "var(--muted)", "stroke-width": 1, visibility: "hidden" });
  svg.append(cross);
  const steps = [...new Set(lines.flatMap((l) => l.mean.map((p) => p[0])))].sort((a, b) => a - b);
  svg.addEventListener("mousemove", (event) => {
    const rect = svg.getBoundingClientRect();
    const x = ((event.clientX - rect.left) / rect.width) * W;
    const step = steps.reduce((best, s) => Math.abs(px(s) - x) < Math.abs(px(best) - x) ? s : best, steps[0]);
    cross.setAttribute("x1", px(step)); cross.setAttribute("x2", px(step)); cross.setAttribute("visibility", "visible");
    tip.innerHTML = `<div><b>step ${step.toLocaleString()}</b></div>` + lines.map((l) => {
      const point = l.mean.find((p) => p[0] === step);
      return `<div><span><i class="swatch" style="background:${l.color}"></i>${l.name}</span><b>${fmt(point ? point[1] : null)}</b></div>`;
    }).join("") + marks.filter((m) => m.step === step).map((m) => `<span class="change">${m.text}</span>`).join("");
    tip.style.display = "block";
    tip.style.left = `${Math.min((px(step) / W) * rect.width + 24, rect.width - tip.offsetWidth)}px`;
    tip.style.top = "44px";
  });
  svg.addEventListener("mouseleave", () => { cross.setAttribute("visibility", "hidden"); tip.style.display = "none"; });
  return box;
}

function drawCharts(runs) {
  const byKind = new Map();
  for (const run of runs) { if (!byKind.has(run.kind)) byKind.set(run.kind, []); byKind.get(run.kind).push(run); }
  const kinds = [...byKind.entries()];
  document.getElementById("legend").innerHTML = kinds.length < 2 ? "" : kinds.map(([kind, of]) =>
    `<span>${swatch(kind)}${kind} (${of.length} seed${of.length > 1 ? "s" : ""})</span>`).join("");
  const xMax = Math.max(1000, ...runs.flatMap((r) => r.rows.map((row) => row.step)));
  const marks = runs.flatMap(changes);
  document.getElementById("charts").replaceChildren(...PANELS.map((panel) => drawPanel(panel, kinds, xMax, marks)));
}

function message(title, detail) {
  document.getElementById("legend").replaceChildren();
  document.getElementById("charts").innerHTML = `<div class="nothing"><b>${title}</b>${detail}</div>`;
}

// A running world's controls: built once, then only their values are updated, so a drag is never interrupted.
function makeCard(run) {
  const card = document.createElement("div");
  card.className = "world";
  card.innerHTML = `<div class="top"><b>${swatch(run.kind)}${run.kind} · seed ${run.seed}</b>
      <div class="seg"><button type="button" data-mode="auto">Auto</button><button type="button" data-mode="manual">Manual</button></div>
      <button type="button" class="act stop">Stop</button></div>
    <div class="where"></div><div class="knobs"></div>
    <label class="switch"><input type="checkbox" data-hunters> Hunters (creatures can attack each other)</label>
    <div class="hint"></div><div class="error"></div>`;
  const state = { card, run, pending: {}, dragging: null, stopArmed: 0 };
  const error = card.querySelector(".error");
  const tell = (problem) => { error.textContent = problem ? problem.message : ""; };
  const change = (name, value) => {
    state.pending[name] = { value, until: Date.now() + PENDING_FOR };
    send("/control", { run: state.run.name, settings: { [name]: value } })
      .then(() => tell(null), (problem) => { delete state.pending[name]; tell(problem); updateCard(state); });
  };
  for (const button of card.querySelectorAll(".seg button"))
    button.addEventListener("click", () => send("/control", { run: state.run.name, mode: button.dataset.mode })
      .then(() => { state.run.mode = button.dataset.mode; updateCard(state); tell(null); }, tell));
  const stop = card.querySelector(".stop");
  stop.addEventListener("click", () => {
    if (Date.now() - state.stopArmed > 4000) {  // a second click within 4 seconds stops the world
      state.stopArmed = Date.now();
      stop.textContent = "Click again to stop";
      setTimeout(() => { if (!stop.disabled) stop.textContent = "Stop"; }, 4000);
      return;
    }
    stop.disabled = true;
    stop.textContent = "Stopping…";
    send("/control", { run: state.run.name, stop: true })
      .catch((problem) => { stop.disabled = false; stop.textContent = "Stop"; tell(problem); });
  });
  const box = card.querySelector(".knobs");
  for (const knob of KNOBS) {
    const low = Math.min(knob.easiest, knob.hardest), high = Math.max(knob.easiest, knob.hardest);
    const harderIsLess = knob.hardest < knob.easiest;
    const row = document.createElement("div");
    row.className = "knob";
    row.innerHTML = `<label for="${run.name}-${knob.name}">${knob.label}</label><output></output>
      <input type="range" id="${run.name}-${knob.name}" min="${low}" max="${high}" step="${knob.step}">
      <small><span>${knobFmt(low)} · ${harderIsLess ? "harder" : "easier"}</span><span>${harderIsLess ? "easier" : "harder"} · ${knobFmt(high)}</span></small>`;
    const slider = row.querySelector("input"), shown = row.querySelector("output");
    slider.addEventListener("pointerdown", () => { state.dragging = knob.name; });
    slider.addEventListener("input", () => { shown.textContent = knobFmt(+slider.value); });
    slider.addEventListener("change", () => { state.dragging = null; change(knob.name, +slider.value); });
    box.append(row);
  }
  const hunters = card.querySelector("[data-hunters]");
  hunters.addEventListener("change", () => change("hunters", hunters.checked));
  return state;
}

function updateCard(state) {
  const { card, run } = state, last = lastRow(run), manual = run.mode === "manual", now = Date.now();
  for (const button of card.querySelectorAll(".seg button")) button.classList.toggle("on", button.dataset.mode === run.mode);
  card.querySelector(".where").textContent = last
    ? `step ${last.step.toLocaleString()} · difficulty ${fmt(last.level)} · ${last.population} alive · energy ${last.energy === null ? "-" : Math.round(last.energy * 100) + " %"}`
    : "starting… (the first numbers come after 250 steps)";
  card.querySelector(".hint").textContent = manual
    ? "Manual: only you turn the knobs. A change reaches the world within a second and shows on the charts at the next point."
    : "Auto: the world turns its own knobs every 1,000 steps (harder when many and well fed, easier when few or hungry). Switch to Manual to turn them yourself.";
  const shownValue = (name, fromRow, close) => {  // a value moved by hand is shown until the world's row confirms it
    const pending = state.pending[name];
    if (!pending) return fromRow;
    if (now > pending.until || close(fromRow, pending.value)) { delete state.pending[name]; return fromRow; }
    return pending.value;
  };
  card.querySelectorAll(".knob").forEach((row, index) => {
    const knob = KNOBS[index], slider = row.querySelector("input");
    slider.disabled = !manual;
    if (state.dragging === knob.name) return;
    const value = shownValue(knob.name, last ? last[knob.name] : knob.start, (a, b) => Math.abs(a - b) <= knob.step);
    slider.value = value;
    row.querySelector("output").textContent = knobFmt(value);
  });
  const hunters = card.querySelector("[data-hunters]");
  hunters.disabled = !manual;
  hunters.checked = shownValue("hunters", last ? !!last.hunters : false, (a, b) => a === b);
}

function drawWorlds(running) {
  const box = document.getElementById("worlds"), names = new Set(running.map((r) => r.name));
  for (const name of [...cards.keys()]) if (!names.has(name)) { cards.get(name).card.remove(); cards.delete(name); }
  for (const run of running) {
    if (!cards.has(run.name)) { cards.set(run.name, makeCard(run)); box.append(cards.get(run.name).card); }
    const state = cards.get(run.name);
    state.run = run;
    updateCard(state);
  }
  const full = running.length >= 2, note = document.getElementById("start-error");
  document.getElementById("start-go").disabled = full;
  if (full) say(note, "2 worlds are running: stop one to start another.", "full");
  else if (note.dataset.kind === "full" || (note.dataset.kind === "starting" && running.every((r) => r.rows.length)))
    say(note, "", "");  // the note is out of date
}

function historyCard(run) {
  const last = lastRow(run);
  const card = document.createElement("button");
  card.type = "button";
  card.className = "run" + (run.name === picked ? " picked" : "");
  const limit = run.steps === null ? "no limit" : `of ${thousands(run.steps)}`;
  const reached = last ? `${thousands(last.step)} steps (${limit}) · difficulty ${fmt(last.level)}` : "no steps";
  const minutes = run.seconds === null ? null : (run.seconds / 60).toFixed(1);
  const end = run.status !== "finished" ? "ended without finishing"
    : run.steps === null || (last && last.step < run.steps) ? `stopped after ${minutes} min` : `finished in ${minutes} min`;
  card.innerHTML = `<b>${swatch(run.kind)}${run.kind} · seed ${run.seed}</b><div>${run.started.replace("T", " ")}</div><div>${reached}</div><div>${end}</div>`;
  card.addEventListener("click", () => { picked = run.name; render(); });
  return card;
}

function render() {
  for (const name of ["live", "history"]) document.getElementById(`tab-${name}`).classList.toggle("on", view === name);
  const live = view === "live";
  document.getElementById("start").hidden = !live;
  document.getElementById("worlds").hidden = !live;
  document.getElementById("runs").hidden = live;
  if (live) {
    const running = data.filter((run) => run.status === "running");
    drawWorlds(running);
    if (!running.length) return message("Nothing is running", "Start a world above. Past runs are in History.");
    return drawCharts(running);
  }
  const past = data.filter((run) => run.status !== "running");
  document.getElementById("runs").replaceChildren(...past.map(historyCard));
  if (!past.length) return message("No past runs yet", "A run appears here when it ends.");
  const chosen = past.find((run) => run.name === picked);
  if (!chosen) return message("Pick a run", "Click a run above to see its charts.");
  drawCharts([chosen]);
}

function show(next) {
  view = next;
  history.replaceState(null, "", next === "history" ? "#history" : "#");
  render();
}
document.getElementById("tab-live").addEventListener("click", () => show("live"));
document.getElementById("tab-history").addEventListener("click", () => show("history"));

for (const button of document.querySelectorAll("#start-mode button"))
  button.addEventListener("click", () => {
    startMode = button.dataset.mode;
    for (const other of document.querySelectorAll("#start-mode button")) other.classList.toggle("on", other === button);
  });
document.getElementById("start-go").addEventListener("click", async () => {
  const error = document.getElementById("start-error"), go = document.getElementById("start-go");
  go.disabled = true;
  try {
    await send("/start", { species: document.getElementById("start-species").value,
                           seed: Number(document.getElementById("start-seed").value), mode: startMode });
    say(error, "Starting… the first numbers come after 250 steps.", "starting");
    signature = "";
    await poll();
  } catch (problem) {
    say(error, problem.message, "refused");
  } finally {
    go.disabled = data.filter((run) => run.status === "running").length >= 2;
  }
});

async function poll() {
  const clock = document.getElementById("clock");
  try {
    const next = await (await fetch("/data", { cache: "no-store" })).json();
    for (const run of next) run.rows.forEach((row, i) => {
      const gap = row.step - (i ? run.rows[i - 1].step : 0);  // rows every 250 steps (every 1,000 in older runs)
      row.deaths = (row.deaths_hunger + row.deaths_attack + row.deaths_age) * 1000 / gap;
      row.energy_percent = row.energy === null ? null : row.energy * 100;
    });
    const now = JSON.stringify(next.map((r) => [r.name, r.rows.length, r.status, r.mode]));
    if (now !== signature) { signature = now; data = next; lastChange = Date.now(); render(); }
    const running = next.filter((run) => run.status === "running").length;
    const ago = Math.round((Date.now() - lastChange) / 1000);
    clock.innerHTML = running
      ? `<i class="dot"></i>${running} running · last new data ${ago < 5 ? "just now" : ago + " s ago"}`
      : '<i class="dot stale"></i>nothing running';
  } catch (error) {
    clock.innerHTML = '<i class="dot stale"></i>viewer server not reachable';
  }
}

(async () => {
  try { KNOBS = (await (await fetch("/knobs")).json()).knobs; } catch (error) { KNOBS = []; }
  render();
  await poll();
  setInterval(poll, 2000);
})();
</script>
</body>
</html>
