<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Life: live</title>
<style>
  :root {
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --muted: #52514e; --grid: #e4e3df;
    --learning: #2a78d6; --instinct: #eb6834; --inborn: #1baf7a; --rules: #eda100; --random: #e87ba4; --other: #8a8983;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --muted: #c3c2b7; --grid: #2e2e2b;
      --learning: #3987e5; --instinct: #d95926; --inborn: #199e70; --rules: #c98500; --random: #d55181; --other: #8a8983;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--page); color: var(--ink);
         font: 14px/1.4 system-ui, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; margin-bottom: 12px; }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }
  #legend { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); }
  .swatch { display: inline-block; width: 18px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
  #clock { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--inborn); margin-right: 6px; }
  .dot.stale { background: var(--muted); }
  #runs { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; margin-bottom: 12px; }
  .run { background: var(--surface); border: 1px solid var(--grid); border-radius: 8px; padding: 8px 10px; }
  .run b { font-weight: 600; }
  .run div { color: var(--muted); font-size: 12px; margin-top: 2px; }
  #charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 12px; }
  .panel { background: var(--surface); border: 1px solid var(--grid); border-radius: 8px; padding: 12px 12px 6px; position: relative; }
  .panel h2 { font-size: 13px; margin: 0 0 4px; font-weight: 600; }
  .panel p { margin: 0 0 4px; font-size: 12px; color: var(--muted); }
  svg { width: 100%; height: 250px; display: block; }
  svg text { fill: var(--muted); font-size: 11px; }
  svg text.end { fill: var(--ink); font-size: 12px; }
  .tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--muted);
         border-radius: 6px; padding: 6px 8px; font-size: 12px; white-space: nowrap; display: none; z-index: 2; }
  .tip div { display: flex; justify-content: space-between; gap: 14px; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  @media (max-width: 480px) { #charts { grid-template-columns: 1fr; } body { padding: 10px; } }
</style>
</head>
<body>
<header>
  <h1>Life: live</h1>
  <div id="legend"></div>
  <div id="clock"><i class="dot stale"></i>connecting…</div>
</header>
<div id="runs"></div>
<div id="charts"></div>

<script>
const PANELS = [
  { key: "stage", title: "Stage", note: "0 Garden (nobody dies) → 4 Harsh. It goes up when the exam is passed twice.", step: true },
  { key: "population", title: "Creatures alive" },
  { key: "exam_ratio", title: "Exam score: bites vs random wanderers (×)", note: "1 = no better than wandering. 1.5 twice in a row opens the next stage.",
    refs: [[1, "random wanderers"], [1.5, "pass"]] },
  { key: "toward_food", title: "Steering to food", note: "1 = straight at it, 0 = random.", refs: [[0, "random"]] },
  { key: "bites_per_creature_step", title: "Bites per creature per step" },
  { key: "generation", title: "Deepest generation alive", note: "How many parent-to-baby steps separate the newest creatures from the first ones." },
];
const W = 520, H = 250, M = { l: 44, r: 108, t: 10, b: 30 };
let data = [], stages = [], lastChange = 0, signature = "";

const colorOf = (kind) => {
  for (const [prefix, name] of [["learning-inborn", "inborn"], ["learning", "learning"], ["instinct", "instinct"],
                                ["rules", "rules"], ["random", "random"]]) if (kind.startsWith(prefix)) return `var(--${name})`;
  return "var(--other)";
};
const el = (tag, attrs = {}, text) => {
  const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  if (text !== undefined) node.textContent = text;
  return node;
};
const fmt = (v) => v === null || v === undefined ? "-" : Number.isInteger(v) ? String(v) : Math.abs(v) >= 10 ? v.toFixed(0) : v.toFixed(2);

function meanLine(runs, key) {
  const byStep = new Map();
  for (const run of runs) for (const row of run.rows) {
    if (row[key] === null) continue;
    if (!byStep.has(row.step)) byStep.set(row.step, []);
    byStep.get(row.step).push(row[key]);
  }
  return [...byStep.entries()].sort((a, b) => a[0] - b[0]).map(([x, ys]) => [x, ys.reduce((s, y) => s + y, 0) / ys.length]);
}

function niceTicks(lo, hi, n = 5) {
  if (lo === hi) { lo -= 1; hi += 1; }  // a flat line still gets a readable axis
  const raw = (hi - lo) / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= raw);
  const ticks = [];
  for (let t = Math.floor(lo / step) * step; t <= hi + step * 0.5; t += step) ticks.push(+t.toFixed(10));
  return ticks;
}
// A tick label with just enough decimals that neighbouring ticks never read the same.
const tickLabel = (t, ticks) => t.toFixed((String(+(ticks[1] - ticks[0]).toFixed(6)).split(".")[1] || "").length);

function drawPanel(panel, kinds, xMax) {
  const box = document.createElement("div");
  box.className = "panel";
  box.innerHTML = `<h2>${panel.title}</h2>` + (panel.note ? `<p>${panel.note}</p>` : "");
  const lines = kinds.map(([kind, runs]) => ({
    kind, mean: meanLine(runs, panel.key),
    seeds: runs.map((r) => r.rows.filter((row) => row[panel.key] !== null).map((row) => [row.step, row[panel.key]])),
  })).filter((l) => l.mean.length);
  if (!lines.length) { box.insertAdjacentHTML("beforeend", '<div class="empty">no data yet</div>'); return box; }
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": panel.title });
  const tip = document.createElement("div");
  tip.className = "tip";
  box.append(svg, tip);

  const refs = panel.refs || [];
  const ys = lines.flatMap((l) => l.seeds.flat().map((p) => p[1])).concat(refs.map((r) => r[0]));
  const ticks = panel.key === "stage" ? [0, 1, 2, 3, 4] : niceTicks(Math.min(...ys), Math.max(...ys));
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const px = (x) => M.l + (x / xMax) * (W - M.l - M.r);
  const py = (y) => H - M.b - ((y - y0) / (y1 - y0)) * (H - M.t - M.b);
  const path = (pts) => pts.map(([x, y], i) => {
    if (panel.step && i) return `H${px(x).toFixed(1)}V${py(y).toFixed(1)}`;
    return `${i ? "L" : "M"}${px(x).toFixed(1)},${py(y).toFixed(1)}`;
  }).join("");

  for (const t of ticks) {
    svg.append(el("line", { x1: M.l, x2: W - M.r, y1: py(t), y2: py(t), stroke: "var(--grid)" }));
    svg.append(el("text", { x: M.l - 6, y: py(t) + 4, "text-anchor": "end" }, tickLabel(t, ticks)));
  }
  for (let k = 0; k <= 5; k++) {
    const x = (xMax / 5) * k;
    const thousands = (x / 1000).toFixed(xMax < 10000 ? 1 : 0);
    svg.append(el("text", { x: px(x), y: H - M.b + 16, "text-anchor": "middle" }, `${thousands}k`));
  }
  for (const [value, label] of refs) {
    svg.append(el("line", { x1: M.l, x2: W - M.r, y1: py(value), y2: py(value), stroke: "var(--muted)", "stroke-dasharray": "4 3" }));
    svg.append(el("text", { x: M.l + 4, y: py(value) - 4 }, label));
  }
  for (const line of lines) {
    const color = colorOf(line.kind);
    if (line.seeds.length > 1) for (const seed of line.seeds) if (seed.length)
      svg.append(el("path", { d: path(seed), fill: "none", stroke: color, "stroke-width": 1, opacity: 0.3 }));
    svg.append(el("path", { d: path(line.mean), fill: "none", stroke: color, "stroke-width": 2, "stroke-linejoin": "round" }));
  }
  const ends = lines.map((l) => ({ kind: l.kind, x: l.mean[l.mean.length - 1][0], y: l.mean[l.mean.length - 1][1] }))
    .sort((a, b) => py(a.y) - py(b.y));
  let lastY = -Infinity;
  for (const end of ends) {  // direct labels at the line ends, nudged apart
    const y = Math.max(py(end.y) + 4, lastY + 14);
    lastY = y;
    svg.append(el("circle", { cx: px(end.x), cy: py(end.y), r: 3.5, fill: colorOf(end.kind), stroke: "var(--surface)", "stroke-width": 2 }));
    const value = panel.key === "stage" && stages[end.y] ? `${end.y} ${stages[end.y]}` : fmt(end.y);
    svg.append(el("text", { x: px(end.x) + 8, y, class: "end" }, `${end.kind} ${value}`));
  }

  const cross = el("line", { y1: M.t, y2: H - M.b, stroke: "var(--muted)", "stroke-width": 1, visibility: "hidden" });
  svg.append(cross);
  const steps = [...new Set(lines.flatMap((l) => l.mean.map((p) => p[0])))].sort((a, b) => a - b);
  svg.addEventListener("mousemove", (event) => {
    const rect = svg.getBoundingClientRect();
    const x = ((event.clientX - rect.left) / rect.width) * W;
    const step = steps.reduce((best, s) => Math.abs(px(s) - x) < Math.abs(px(best) - x) ? s : best, steps[0]);
    cross.setAttribute("x1", px(step)); cross.setAttribute("x2", px(step)); cross.setAttribute("visibility", "visible");
    tip.innerHTML = `<div><b>step ${step.toLocaleString()}</b></div>` + lines.map((l) => {
      const point = l.mean.find((p) => p[0] === step);
      return `<div><span><i class="swatch" style="background:${colorOf(l.kind)}"></i>${l.kind}</span><b>${fmt(point ? point[1] : null)}</b></div>`;
    }).join("");
    tip.style.display = "block";
    tip.style.left = `${Math.min((px(step) / W) * rect.width + 24, rect.width - tip.offsetWidth)}px`;
    tip.style.top = "44px";
  });
  svg.addEventListener("mouseleave", () => { cross.setAttribute("visibility", "hidden"); tip.style.display = "none"; });
  return box;
}

function render() {
  const charts = document.getElementById("charts");
  if (!data.length) {
    charts.innerHTML = '<div class="empty">No runs yet. Start one with: python -m src.evolve --seed 1 --species learning</div>';
    document.getElementById("runs").replaceChildren(); document.getElementById("legend").replaceChildren();
    return;
  }
  const byKind = new Map();
  for (const run of data) { if (!byKind.has(run.kind)) byKind.set(run.kind, []); byKind.get(run.kind).push(run); }
  const kinds = [...byKind.entries()];
  document.getElementById("legend").innerHTML = kinds.map(([kind, runs]) =>
    `<span><i class="swatch" style="background:${colorOf(kind)}"></i>${kind} (${runs.length} seed${runs.length > 1 ? "s" : ""})</span>`).join("");
  document.getElementById("runs").replaceChildren(...data.map((run) => {
    const last = run.rows[run.rows.length - 1];
    const card = document.createElement("div");
    card.className = "run";
    const where = last ? `step ${Math.round(last.step / 1000)}k · stage ${last.stage} ${stages[last.stage] || ""} · ${last.population} alive` : "starting…";
    const state = run.seconds !== null ? `finished in ${(run.seconds / 60).toFixed(1)} min` : "running";
    card.innerHTML = `<b><i class="swatch" style="background:${colorOf(run.kind)}"></i>${run.kind} · seed ${run.seed}</b><div>${where}</div><div>${state}</div>`;
    return card;
  }));
  const xMax = Math.max(1000, ...data.flatMap((r) => r.rows.map((row) => row.step)));
  charts.replaceChildren(...PANELS.map((panel) => drawPanel(panel, kinds, xMax)));
}

async function poll() {
  const clock = document.getElementById("clock");
  try {
    if (!stages.length) stages = (await (await fetch("/meta", { cache: "no-store" })).json()).stages;
    const next = await (await fetch("/data", { cache: "no-store" })).json();
    const now = JSON.stringify(next.map((r) => [r.name, r.rows.length, r.seconds]));
    if (now !== signature) { signature = now; data = next; lastChange = Date.now(); render(); }
    const ago = Math.round((Date.now() - lastChange) / 1000);
    clock.innerHTML = `<i class="dot${ago > 180 ? " stale" : ""}"></i>live · last new data ${ago < 5 ? "just now" : ago + " s ago"}`;
  } catch (error) {
    clock.innerHTML = '<i class="dot stale"></i>viewer server not reachable';
  }
}
poll();
setInterval(poll, 2000);
</script>
</body>
</html>
