<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Life</title>
<style>
  :root {
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --muted: #52514e; --grid: #e4e3df; --warn: #b3261e;
    --learning: #2a78d6; --instinct: #eb6834; --inborn: #1baf7a; --rules: #eda100; --random: #e87ba4; --other: #8a8983;
    --food: #3fa34d; --eat: #1baf7a; --miss: #eda100;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --muted: #c3c2b7; --grid: #2e2e2b; --warn: #f2b8b5;
      --learning: #3987e5; --instinct: #d95926; --inborn: #199e70; --rules: #c98500; --random: #d55181; --other: #8a8983;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--page); color: var(--ink);
         font: 14px/1.4 system-ui, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; margin-bottom: 12px; }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }
  button, select, input { font: inherit; color: inherit; }
  .seg { display: inline-flex; gap: 2px; border: 1px solid var(--grid); border-radius: 7px; padding: 2px; }
  .seg button { background: none; border: 0; border-radius: 5px; padding: 3px 12px; cursor: pointer; color: var(--muted); }
  .seg button.on { background: var(--ink); color: var(--page); font-weight: 600; }
  .act { background: var(--surface); border: 1px solid var(--muted); border-radius: 7px; padding: 4px 14px; cursor: pointer; }
  .act:disabled { opacity: 0.5; cursor: default; }
  .act.stop { border-color: var(--warn); color: var(--warn); }
  #legend { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); }
  .swatch { display: inline-block; width: 18px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
  #clock { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--inborn); margin-right: 6px; }
  .dot.stale { background: var(--muted); }
  #start { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; background: var(--surface);
           border: 1px solid var(--grid); border-radius: 8px; padding: 8px 10px; margin-bottom: 12px; }
  #start b { font-weight: 600; }
  #start input, #start select { background: var(--page); border: 1px solid var(--grid); border-radius: 6px; padding: 3px 6px; }
  #start input { width: 70px; }
  .error { color: var(--warn); font-size: 12px; }
  #worlds { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 12px; }
  .world { background: var(--surface); border: 1px solid var(--grid); border-radius: 8px; padding: 10px 12px;
           display: grid; grid-template-columns: minmax(320px, 1fr) minmax(0, 1.3fr); gap: 12px 20px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; align-content: start; }
  .tiles .head { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
  .tile { background: var(--page); border-radius: 8px; padding: 10px 12px; }
  .tile > span { display: block; color: var(--muted); font-size: 12px; }
  .tile strong { display: block; font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.25; }
  .tile small { color: var(--muted); font-size: 11px; }
  .tiles svg { grid-column: 1 / -1; width: 100%; height: 56px; }
  .tiles .line-note { grid-column: 1 / -1; color: var(--muted); font-size: 11px; margin-top: -6px; }
  @media (max-width: 760px) { .world { grid-template-columns: 1fr; } .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .world .top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .world .top b { font-weight: 600; margin-right: auto; }
  .world .where { color: var(--muted); font-size: 12px; margin: 4px 0 8px; font-variant-numeric: tabular-nums; }
  .knob { display: grid; grid-template-columns: 1fr auto; gap: 0 8px; margin: 6px 0; }
  .knob label { font-size: 12px; }
  .knob output { font-size: 12px; font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }
  .knob input[type=range] { grid-column: 1 / -1; width: 100%; margin: 2px 0 0; accent-color: var(--ink); }
  #genes-panel { display: grid; gap: 8px; margin: 8px 0; } #genes-panel .gene-boxes { display: flex; flex-wrap: wrap; gap: 8px 14px; }
  #genes-panel label { display: grid; font-size: 12px; color: var(--muted); }
  #genes-panel input { width: 110px; background: var(--page); color: var(--ink); border: 1px solid var(--grid); border-radius: 6px; padding: 2px 6px; }
  .knob-group { border-top: 1px solid var(--grid); margin-top: 8px; padding-top: 4px; }
  .knob-group h4 { margin: 2px 0 0; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .knob small { grid-column: 1 / -1; color: var(--muted); font-size: 11px; display: flex; justify-content: space-between; }
  .knob input:disabled { opacity: 0.55; }
  .switch { display: flex; align-items: center; gap: 8px; font-size: 12px; margin-top: 8px; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
  #runs { margin-bottom: 12px; }
  #runs .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  #runs .bar select { background: var(--page); border: 1px solid var(--grid); border-radius: 6px; padding: 2px 6px; }
  .table { overflow-x: auto; border: 1px solid var(--grid); border-radius: 8px; background: var(--surface); }
  .row { display: grid; grid-template-columns: minmax(200px, 2.2fr) repeat(8, minmax(78px, 1fr)); align-items: center;
         gap: 0 10px; padding: 8px 12px; border-top: 1px solid var(--grid); min-width: 900px; cursor: pointer; }
  .row.head { border-top: 0; cursor: default; color: var(--muted); font-size: 12px; }
  .row.head .sort { background: none; border: 0; padding: 0; text-align: left; color: inherit; font: inherit; cursor: pointer; }
  .row.head .sort:hover { color: var(--ink); }
  #runs .bar label { display: inline-flex; align-items: center; gap: 5px; }
  .row:not(.head):hover, .row.picked { background: var(--page); }
  .row b { font-weight: 600; }
  .row small { display: block; color: var(--muted); font-size: 12px; }
  .row .num { font-variant-numeric: tabular-nums; }
  .row .num strong { font-weight: 600; font-size: 15px; }
  .good { color: var(--eat); } .bad { color: var(--warn); }
  #rules-page { display: grid; gap: 14px; }
  .chart-bar { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; color: var(--muted); font-size: 12px; }
  .chart-bar > span { display: inline-flex; align-items: center; gap: 6px; }
  .rules-table { border: 1px solid var(--grid); border-radius: 8px; background: var(--surface); padding: 10px 14px; overflow-x: auto; }
  .rules-table h2 { font-size: 15px; margin: 0 0 6px; } .rules-table h2 small { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 8px; }
  .rules-table table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 820px; }
  .rules-table th { text-align: left; color: var(--muted); font-weight: 400; font-size: 12px; padding: 4px 6px; border-bottom: 1px solid var(--grid); }
  .rules-table td { padding: 4px 6px; border-bottom: 1px solid var(--grid); }
  .rules-table input { width: 84px; background: var(--page); color: var(--ink); border: 1px solid var(--grid); border-radius: 6px; padding: 2px 6px; }
  .rules-table .auto { font-size: 11px; padding: 1px 6px; border-radius: 6px; border: 1px solid var(--muted); color: var(--muted); margin-left: 6px; }
  .rules-table .error { display: block; }
  .rules-table td.name { width: 22%; font-weight: 600; } .rules-table td.means { width: 44%; line-height: 1.35; }
  .rules-table .meaning { display: block; color: var(--accent, #7fb3ff); font-size: 12px; margin-top: 2px; }
  .rules-table .meaning:empty { display: none; } .rules-table td { vertical-align: top; padding: 7px 6px; }
  .mark { font-size: 11px; border: 1px solid var(--ink); border-radius: 5px; padding: 0 5px; margin-left: 6px; }
  [data-tip] { cursor: help; text-decoration: underline dotted var(--muted); text-underline-offset: 3px; }
  #tip { position: fixed; z-index: 5; max-width: 340px; background: var(--surface); border: 1px solid var(--muted);
         border-radius: 6px; padding: 8px 10px; font-size: 12px; line-height: 1.45; pointer-events: none; display: none; }
  #charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 12px; }
  .panel { background: var(--surface); border: 1px solid var(--grid); border-radius: 8px; padding: 12px 12px 6px; position: relative; }
  .panel h2 { font-size: 13px; margin: 0 0 4px; font-weight: 600; }
  .panel p { margin: 0 0 4px; font-size: 12px; color: var(--muted); }
  svg { width: 100%; height: 250px; display: block; }
  svg text { fill: var(--muted); font-size: 11px; }
  svg text.end { fill: var(--ink); font-size: 12px; }
  .tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--muted);
         border-radius: 6px; padding: 6px 8px; font-size: 12px; white-space: nowrap; display: none; z-index: 2; }
  .tip div { display: flex; justify-content: space-between; gap: 14px; }
  .tip .change { display: block; color: var(--muted); }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  .nothing { grid-column: 1 / -1; padding: 50px 0; text-align: center; color: var(--muted); }
  .nothing b { display: block; font-size: 22px; font-weight: 600; color: var(--ink); margin-bottom: 8px; }
  #watch { background: var(--surface); border: 1px solid var(--grid); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
  #watch .top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 8px; }
  #watch .top b { font-weight: 600; }
  #watch .top span { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  #watch .top label { margin-left: auto; font-size: 12px; display: flex; align-items: center; gap: 6px; }
  #watch canvas { width: 100%; display: block; border-radius: 6px; background: var(--page); }
  #watch .zoom { display: inline-flex; align-items: center; gap: 4px; } #watch .zoom .act { padding: 2px 10px; }
  #watch .zoom output { min-width: 3.2em; text-align: center; font-variant-numeric: tabular-nums; }
  #watch-canvas { touch-action: none; cursor: crosshair; }
  #watch-legend { width: 100%; display: block; margin-top: 8px; }
  .resume { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 12px; margin-top: 8px; }
  .resume select { background: var(--page); border: 1px solid var(--grid); border-radius: 6px; padding: 2px 6px; }
  #resume-bar { grid-column: 1 / -1; background: var(--surface); border: 1px solid var(--grid); border-radius: 8px; padding: 8px 12px; }
  .paused { color: var(--miss); font-weight: 600; }
  [hidden] { display: none !important; }
  @media (max-width: 480px) { #charts, #worlds { grid-template-columns: 1fr; } body { padding: 10px; } }
</style>
</head>
<body>
<header>
  <h1>Life</h1>
  <div class="seg">
    <button id="tab-live" type="button">Live</button>
    <button id="tab-history" type="button">History</button>
    <button id="tab-rules" type="button">Rules</button>
  </div>
  <div id="legend"></div>
  <div id="clock"><i class="dot stale"></i>connecting…</div>
</header>

<section id="start">
  <b>Start a world</b>
  <select id="start-species" aria-label="Animals">
    <option value="learning">learning animals</option>
    <option value="instinct">instinct animals</option>
  </select>
  <label>seed <input id="start-seed" type="number" min="0" step="1" value="1"></label>
  <div class="seg" id="start-mode">
    <button type="button" data-mode="auto" class="on">Auto</button>
    <button type="button" data-mode="manual">Manual</button>
  </div>
  <button id="start-go" class="act" type="button">Start</button>
  <span id="start-error" class="error"></span>
</section>
<div id="worlds"></div>
<section id="watch" hidden>
  <div class="top">
    <b id="watch-title"></b><span id="watch-where">waiting for the first picture…</span>
    <label>steps a second <input id="watch-speed" type="range" min="1" max="30" step="1" value="10"><output id="watch-speed-shown">10</output></label>
    <span class="zoom"><button id="zoom-out" class="act" type="button" aria-label="Zoom out">−</button><output id="zoom-shown">1×</output><button id="zoom-in" class="act" type="button" aria-label="Zoom in">+</button></span>
    <span id="follow-note" hidden>following <b id="follow-who"></b> <button id="follow-pov" class="act" type="button" aria-pressed="false" data-tip="See only what it sees; what it hears shows as a blur with its distance">POV</button> <button id="follow-genes" class="act" type="button" aria-expanded="false">Genes</button> <button id="follow-stop" class="act" type="button">Stop following</button></span>
    <button id="watch-out" class="act" type="button">Jump out</button>
  </div>
  <form id="genes-panel" hidden>
    <div class="gene-boxes"></div>
    <button class="act" type="submit">Apply to this creature</button> <span class="error" id="genes-said"></span>
  </form>
  <canvas id="watch-canvas" width="1000" height="600" aria-label="The world, seen from above"></canvas>
  <canvas id="watch-legend" height="120" aria-label="What a creature's look means: point at a creature in the world to see its numbers"></canvas>
</section>
<section id="rules-page" hidden></section>
<div id="runs"></div>
<div id="charts"></div>
<div id="tip" role="tooltip"></div>

<script>
const PANELS = [
  { key: "level", title: "Difficulty", step: true,
    note: "How many 5 % nudges harder than the easy start the world is (below 0: easier). Whoever survives a harder world is smarter." },
  { key: "intelligence", title: "Intelligence: energy earned ÷ energy spent, in the test",
    note: "Every 2,000 steps up to 20 creatures take the same fixed test. Above 1 = they gain more energy than they burn. Dashed: random wanderers in the same test.",
    beside: { key: "wanderers", label: "wanderers" } },
  { key: "energy_percent", title: "Average energy per creature (% of a full tank)",
    note: "How well fed the creatures are.", refs: [[70, "has a baby"], [30, "below this, the old die"]] },
  { key: "population", title: "Creatures alive" },
  { key: "efficiency", title: "Energy earned ÷ energy spent, in the living world",
    note: "The same measure in the world they live in. It drops when the world gets harder and climbs as they get smarter.",
    refs: [[1, "breaks even"]] },
  { key: "deaths", title: "Deaths per 1,000 steps", note: "Only creatures with low energy die." },
  { key: "toward_food", title: "Steering to food", note: "When a creature sees food and moves: 1 = straight at it, 0 = random.", refs: [[0, "random"]] },
  { key: "generation", title: "Deepest generation alive", note: "How many parent-to-baby steps separate the newest creatures from the first ones." },
  { key: "bites_per_creature_step", title: "Bites per creature per step" },
  { key: "flee", title: "Fleeing and chasing", hunters: true, beside: { key: "chase", label: "chasing" },
    note: "While hunters are on. Solid: when a bigger creature is in sight, the share of moves away from it. Dashed: when a smaller one is in sight, the share of moves toward it." },
  { key: "attacks_rate", title: "Attacks tried per 1,000 steps", hunters: true },
  { key: "vision_width", title: "Vision cone width (degrees, average)",
    note: "Each creature's cone is in its genes: wider sees more around it, and costs more energy every step." },
  { key: "vision_reach", title: "How far creatures see (average)",
    note: "In its genes too: seeing farther costs energy every step, by the area seen." },
  { key: "hearing", title: "How far creatures hear, all around (average)",
    note: "Hearing reaches behind it too, but tells only where another creature is and how big; it costs by the area heard." },
  { key: "fear_of_death", title: "Fear of death (average)",
    note: "In each creature's genes: how much dying counts against it in its learning (a bite is worth 1). Started at 10." },
  { key: "love_of_babies", title: "Love of babies (average)",
    note: "In its genes: how much having a baby counts for it in its learning. Started at 10." },
  { key: "neurons", title: "Neurons in a brain (average)",
    note: "In each creature's genes: how many neurons its brain uses. Each costs energy every step; a baby whose changed gene is its brain gains or loses one (sometimes a layer). Started at 32." },
  { key: "layers", title: "Layers in a brain (average)", note: "In the genes too: 1 to 3. A new layer starts silent." },
  { key: "learns_from_others", title: "Learning from others (average)",
    note: "In its genes: how much a step it sees another live teaches it, against a step of its own (1 = as much). Started at 0.5." },
];
const W = 520, H = 250, M = { l: 44, r: 108, t: 10, b: 30 };
const PENDING_FOR = 20000;  // ms a value moved by hand is shown before the world's own row must confirm it
let data = [], lastChange = 0, signature = "", picked = null, KNOBS = [], startMode = "auto";
let view = { "#history": "history", "#rules": "rules" }[location.hash] || "live";
const cards = new Map();  // a running world's controls, kept between polls so a drag is never interrupted

const colorOf = (kind) => {
  for (const [prefix, name] of [["learning-inborn", "inborn"], ["learning", "learning"], ["instinct", "instinct"],
                                ["rules", "rules"], ["random", "random"]]) if (kind.startsWith(prefix)) return `var(--${name})`;
  return "var(--other)";
};
const el = (tag, attrs = {}, text) => {
  const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  if (text !== undefined) node.textContent = text;
  return node;
};
const fmt = (v) => v === null || v === undefined ? "-" : Number.isInteger(v) ? String(v) : Math.abs(v) >= 10 ? v.toFixed(0) : v.toFixed(2);
const knobFmt = (v) => Math.abs(v) >= 100 ? Math.round(v).toLocaleString() : Math.abs(v) >= 10 ? v.toFixed(1) : v.toFixed(Math.abs(v) >= 1 ? 2 : 3);
const thousands = (steps) => `${Math.round(steps / 1000)}k`;
const lastRow = (run) => run.rows[run.rows.length - 1];
const swatch = (kind) => `<i class="swatch" style="background:${colorOf(kind)}"></i>`;
const say = (node, text, kind) => { node.textContent = text; node.dataset.kind = kind; };

async function send(path, body) {
  const response = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const answer = await response.json();
  if (!response.ok) throw new Error(answer.error || `refused (${response.status})`);
  return answer;
}

// What changed from one row to the next, and who changed it.
function changes(run) {
  const found = [];
  for (let i = 1; i < run.rows.length; i++) {
    const before = run.rows[i - 1], after = run.rows[i], what = [];
    for (const knob of KNOBS) {
      const a = before[knob.name], b = after[knob.name];
      if (a !== null && b !== null && Math.abs(a - b) > 1e-9 * Math.max(1, Math.abs(a))) what.push(`${knob.label} ${knobFmt(a)} → ${knobFmt(b)}`);
    }
    if (before.hunters !== after.hunters) what.push(`hunters ${after.hunters ? "on" : "off"}`);
    if (what.length) found.push({ step: after.step, color: colorOf(run.kind), byYou: !!after.manual,
                                  text: `${what.join(", ")}, by ${after.manual ? "you" : "Auto"}` });
  }
  return found;
}

function meanLine(runs, key) {
  const byStep = new Map();
  for (const run of runs) for (const row of run.rows) {
    if (row[key] === null) continue;
    if (!byStep.has(row.step)) byStep.set(row.step, []);
    byStep.get(row.step).push(row[key]);
  }
  return [...byStep.entries()].sort((a, b) => a[0] - b[0]).map(([x, ys]) => [x, ys.reduce((s, y) => s + y, 0) / ys.length]);
}

function niceTicks(lo, hi, n = 5) {
  if (lo === hi) { lo -= 1; hi += 1; }  // a flat line still gets a readable axis
  const raw = (hi - lo) / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= raw);
  const ticks = [];
  for (let t = Math.floor(lo / step) * step; t <= hi + step * 0.5; t += step) ticks.push(+t.toFixed(10));
  return ticks;
}
// A tick label with just enough decimals that neighbouring ticks never read the same.
const tickLabel = (t, ticks) => t.toFixed((String(+(ticks[1] - ticks[0]).toFixed(6)).split(".")[1] || "").length);

// How the charts read: which last steps they show, one point per how many steps, and how much they smooth.
const CHART_SPANS = [[10000, "10k"], [50000, "50k"], [0, "all"]];
const CHART_POINTS = [[250, "250"], [1000, "1,000"], [5000, "5,000"]];
const CHART_SMOOTH = [[1, "none"], [3, "light"], [9, "strong"]];
const chartView = (() => {
  try { return { span: 10000, per: 1000, smooth: 3, ...JSON.parse(localStorage.getItem("life.charts") || "{}") }; }
  catch (error) { return { span: 10000, per: 1000, smooth: 3 }; }
})();

function chartRows(rows, xMin) {  // the rows of the span, one point per stretch: each the average of its rows
  const bins = new Map();
  for (const row of rows) {
    if (row.step <= xMin) continue;
    const bin = Math.ceil(row.step / chartView.per) * chartView.per;
    if (!bins.has(bin)) bins.set(bin, []);
    bins.get(bin).push(row);
  }
  return [...bins.entries()].sort((a, b) => a[0] - b[0]).map(([bin, group]) => {
    const point = { ...group[group.length - 1], step: bin };
    for (const key of Object.keys(point)) {
      if (key === "step" || typeof group[0][key] !== "number") continue;
      const known = group.map((r) => r[key]).filter((v) => v !== null && v !== undefined);
      point[key] = known.length ? known.reduce((a, b) => a + b, 0) / known.length : null;
    }
    return point;
  });
}

function smoothed(rows) {  // a moving average over `chartView.smooth` points, each key on its own
  const half = Math.floor(chartView.smooth / 2);
  if (!half) return rows;
  return rows.map((row, i) => {
    const out = { ...row }, around = rows.slice(Math.max(0, i - half), i + half + 1);
    for (const key of Object.keys(row)) {
      if (key === "step" || typeof row[key] !== "number") continue;
      const known = around.map((r) => r[key]).filter((v) => v !== null && v !== undefined);
      out[key] = known.length ? known.reduce((a, b) => a + b, 0) / known.length : null;
    }
    return out;
  });
}

function chartBar() {
  const bar = document.createElement("div");
  bar.className = "chart-bar";
  const group = (label, key, options) => `<span>${label}<span class="seg">${options.map(([value, words]) =>
    `<button type="button" data-chart="${key}" data-value="${value}" class="${chartView[key] === value ? "on" : ""}">${words}</button>`).join("")}</span></span>`;
  bar.innerHTML = group("Last", "span", CHART_SPANS) + group("One point per", "per", CHART_POINTS) + group("Smoothing", "smooth", CHART_SMOOTH);
  bar.addEventListener("click", (event) => {
    const button = event.target.closest("[data-chart]");
    if (!button) return;
    chartView[button.dataset.chart] = Number(button.dataset.value);
    try { localStorage.setItem("life.charts", JSON.stringify(chartView)); } catch (error) { /* only remembered here */ }
    render();
  });
  return bar;
}

function drawPanel(panel, kinds, xMin, xMax, marks, rawKinds) {
  const box = document.createElement("div");
  box.className = "panel";
  box.innerHTML = `<h2>${panel.title}</h2>` + (panel.note ? `<p>${panel.note}</p>` : "");
  const lines = kinds.map(([kind, runs]) => ({
    name: kind, color: colorOf(kind), mean: meanLine(runs, panel.key),
    seeds: runs.map((r) => r.rows.filter((row) => row[panel.key] !== null).map((row) => [row.step, row[panel.key]])),
  })).filter((l) => l.mean.length);
  if (!lines.length) { box.insertAdjacentHTML("beforeend", '<div class="empty">no data yet</div>'); return box; }
  const raw = chartView.smooth > 1 ? rawKinds.map(([kind, runs]) => ({ color: colorOf(kind), mean: meanLine(runs, panel.key) }))
    .filter((l) => l.mean.length) : [];
  if (panel.beside) {  // the yardstick drawn beside the creatures' own line
    const mean = meanLine(kinds.flatMap(([, runs]) => runs), panel.beside.key);
    if (mean.length) lines.push({ name: panel.beside.label, color: "var(--muted)", mean, seeds: [mean], dashed: true });
  }
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": panel.title });
  const tip = document.createElement("div");
  tip.className = "tip";
  box.append(svg, tip);

  const refs = panel.refs || [];
  const ys = lines.flatMap((l) => l.seeds.flat().map((p) => p[1])).concat(refs.map((r) => r[0]));
  const ticks = niceTicks(Math.min(...ys), Math.max(...ys));
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const px = (x) => M.l + ((x - xMin) / (xMax - xMin)) * (W - M.l - M.r);
  const py = (y) => H - M.b - ((y - y0) / (y1 - y0)) * (H - M.t - M.b);
  const path = (pts) => pts.map(([x, y], i) => {
    if (panel.step && i) return `H${px(x).toFixed(1)}V${py(y).toFixed(1)}`;
    return `${i ? "L" : "M"}${px(x).toFixed(1)},${py(y).toFixed(1)}`;
  }).join("");

  for (const t of ticks) {
    svg.append(el("line", { x1: M.l, x2: W - M.r, y1: py(t), y2: py(t), stroke: "var(--grid)" }));
    svg.append(el("text", { x: M.l - 6, y: py(t) + 4, "text-anchor": "end" }, tickLabel(t, ticks)));
  }
  for (let k = 0; k <= 5; k++) {
    const x = xMin + ((xMax - xMin) / 5) * k;
    svg.append(el("text", { x: px(x), y: H - M.b + 16, "text-anchor": "middle" }, `${(x / 1000).toFixed(xMax - xMin < 10000 ? 1 : 0)}k`));
  }
  for (const mark of marks.filter((m) => m.byYou))  // the owner changed a knob here (Auto's changes are only in the hover text)
    svg.append(el("line", { x1: px(mark.step), x2: px(mark.step), y1: M.t, y2: H - M.b, stroke: mark.color, "stroke-width": 1, opacity: 0.6 }));
  for (const line of raw)  // the raw points, faint behind the smoothed line
    svg.append(el("path", { d: path(line.mean), fill: "none", stroke: line.color, "stroke-width": 1, opacity: 0.25 }));
  for (const [value, label] of refs) {
    svg.append(el("line", { x1: M.l, x2: W - M.r, y1: py(value), y2: py(value), stroke: "var(--muted)", "stroke-dasharray": "2 4" }));
    svg.append(el("text", { x: M.l + 4, y: py(value) - 4 }, label));
  }
  for (const line of lines) {
    if (!line.dashed && line.seeds.length > 1) for (const seed of line.seeds) if (seed.length)
      svg.append(el("path", { d: path(seed), fill: "none", stroke: line.color, "stroke-width": 1, opacity: 0.3 }));
    const stroke = { d: path(line.mean), fill: "none", stroke: line.color, "stroke-width": 2, "stroke-linejoin": "round" };
    if (line.dashed) stroke["stroke-dasharray"] = "6 4";
    svg.append(el("path", stroke));
  }
  const ends = lines.map((l) => ({ line: l, x: l.mean[l.mean.length - 1][0], y: l.mean[l.mean.length - 1][1] }))
    .sort((a, b) => py(a.y) - py(b.y));
  let lastY = -Infinity;
  for (const end of ends) {  // direct labels at the line ends, nudged apart
    const y = Math.max(py(end.y) + 4, lastY + 14);
    lastY = y;
    svg.append(el("circle", { cx: px(end.x), cy: py(end.y), r: 3.5, fill: end.line.color, stroke: "var(--surface)", "stroke-width": 2 }));
    svg.append(el("text", { x: px(end.x) + 8, y, class: "end" }, `${end.line.name} ${fmt(end.y)}`));
  }

  const cross = el("line", { y1: M.t, y2: H - M.b, stroke: "var(--muted)", "stroke-width": 1, visibility: "hidden" });
  svg.append(cross);
  const steps = [...new Set(lines.flatMap((l) => l.mean.map((p) => p[0])))].sort((a, b) => a - b);
  svg.addEventListener("mousemove", (event) => {
    const rect = svg.getBoundingClientRect();
    const x = ((event.clientX - rect.left) / rect.width) * W;
    const step = steps.reduce((best, s) => Math.abs(px(s) - x) < Math.abs(px(best) - x) ? s : best, steps[0]);
    cross.setAttribute("x1", px(step)); cross.setAttribute("x2", px(step)); cross.setAttribute("visibility", "visible");
    tip.innerHTML = `<div><b>step ${step.toLocaleString()}</b></div>` + lines.map((l) => {
      const point = l.mean.find((p) => p[0] === step);
      return `<div><span><i class="swatch" style="background:${l.color}"></i>${l.name}</span><b>${fmt(point ? point[1] : null)}</b></div>`;
    }).join("") + marks.filter((m) => m.step > step - chartView.per && m.step <= step).map((m) => `<span class="change">${m.text}</span>`).join("");
    tip.style.display = "block";
    tip.style.left = `${Math.min((px(step) / W) * rect.width + 24, rect.width - tip.offsetWidth)}px`;
    tip.style.top = "44px";
  });
  svg.addEventListener("mouseleave", () => { cross.setAttribute("visibility", "hidden"); tip.style.display = "none"; });
  return box;
}

function drawCharts(runs) {
  const byKind = new Map();
  for (const run of runs) { if (!byKind.has(run.kind)) byKind.set(run.kind, []); byKind.get(run.kind).push(run); }
  const kinds = [...byKind.entries()];
  document.getElementById("legend").innerHTML = kinds.map(([kind, of]) =>
    `<span>${swatch(kind)}${KIND_WORDS[kind.split("-")[0]] || kind}${of.length > 1 ? ` (${of.length} seeds)` : ""}</span>`).join("");
  const xMax = Math.max(1000, ...runs.flatMap((r) => r.rows.map((row) => row.step)));
  const xMin = chartView.span ? Math.max(0, xMax - chartView.span) : 0;
  const marks = runs.flatMap(changes).filter((m) => m.step > xMin);
  const rawKinds = kinds.map(([kind, of]) => [kind, of.map((run) => ({ ...run, rows: chartRows(run.rows, xMin) }))]);
  const shown = rawKinds.map(([kind, of]) => [kind, of.map((run) => ({ ...run, rows: smoothed(run.rows) }))]);
  const hunting = runs.some((run) => run.rows.some((row) => row.hunters));
  document.getElementById("charts").replaceChildren(chartBar(), ...PANELS.filter((panel) => !panel.hunters || hunting)
    .map((panel) => drawPanel(panel, shown, xMin, Math.max(xMax, xMin + 1), marks, rawKinds)));
}

function message(title, detail) {
  document.getElementById("legend").replaceChildren();
  document.getElementById("charts").innerHTML = `<div class="nothing"><b>${title}</b>${detail}</div>`;
}

// The senses' prices: rules of the world, so they can be changed in Auto too. Each says what the average creature pays.
const SENSE_COSTS = [
  ["vision_cost", "Cost of seeing (per square unit of its cone, per step)",
   (g) => g.vision_width[1] / 360 * Math.PI * g.vision_reach[1] ** 2],
  ["hearing_cost", "Cost of hearing (per square unit of its circle, per step)", (g) => Math.PI * g.hearing[1] ** 2],
];

// The world card's sliders in groups: each of Auto's knobs and each senses price named in exactly one.
const KNOB_GROUPS = [
  ["Food", ["max_food", "food_energy", "food_per_step"]],
  ["Costs", ["move_cost", "step_cost", "vision_cost", "hearing_cost"]],
  ["Life", ["lifespan"]],
];

// A running world's controls: built once, then only their values are updated, so a drag is never interrupted.
function makeCard(run) {
  const card = document.createElement("div");
  card.className = "world";
  card.innerHTML = `<div class="top"><b>${swatch(run.kind)}${title(run)}</b>
      <div class="seg"><button type="button" data-mode="auto">Auto</button><button type="button" data-mode="manual">Manual</button></div>
      <button type="button" class="act jump">Jump in</button>
      <button type="button" class="act pause">Pause</button>
      <button type="button" class="act update" data-tip="The world saves itself at the step it is at and goes on at once from there with the newest code, in the same run: nothing is lost.">Update code</button>
      <button type="button" class="act stop">Stop</button></div>
    <div class="where"></div><div class="knobs"></div>
    <label class="switch"><input type="checkbox" data-hunters> Hunters (creatures can attack each other)</label>
    <div class="hint"></div><div class="error"></div>`;
  const state = { card, run, pending: {}, dragging: null, stopArmed: 0, now: null, samples: [] };
  const controls = document.createElement("div");
  controls.append(...card.childNodes);  // the knobs on the left, the live tiles on the right
  card.append(controls, makeTiles(state));
  const timer = setInterval(() => card.isConnected ? pollNow(state) : clearInterval(timer), NOW_EVERY_MS);
  pollNow(state);
  const error = card.querySelector(".error");
  const tell = (problem) => { error.textContent = problem ? problem.message : ""; };
  const change = (name, value) => {
    state.pending[name] = { value, until: Date.now() + PENDING_FOR };
    send("/control", { run: state.run.name, settings: { [name]: value } })
      .then(() => tell(null), (problem) => { delete state.pending[name]; tell(problem); updateCard(state); });
  };
  for (const button of card.querySelectorAll(".seg button"))
    button.addEventListener("click", () => send("/control", { run: state.run.name, mode: button.dataset.mode })
      .then(() => { state.run.mode = button.dataset.mode; updateCard(state); tell(null); }, tell));
  card.querySelector(".jump").addEventListener("click", () => jumpIn(state.run).catch(tell));
  const update = card.querySelector(".update");
  update.addEventListener("click", () => {
    update.disabled = true;
    update.textContent = "Updating…";
    send("/control", { run: state.run.name, update: true })
      .then(() => tell(null), (problem) => { update.disabled = false; update.textContent = "Update code"; tell(problem); });
    setTimeout(() => { update.disabled = false; update.textContent = "Update code"; }, 60000);
  });
  card.querySelector(".pause").addEventListener("click", () => {
    const paused = !state.run.paused;
    send("/control", { run: state.run.name, paused }).then(() => { state.run.paused = paused; updateCard(state); tell(null); }, tell);
  });
  const stop = card.querySelector(".stop");
  stop.addEventListener("click", () => {
    if (Date.now() - state.stopArmed > 4000) {  // a second click within 4 seconds stops the world
      state.stopArmed = Date.now();
      stop.textContent = "Click again to stop";
      setTimeout(() => { if (!stop.disabled) stop.textContent = "Stop"; }, 4000);
      return;
    }
    stop.disabled = true;
    stop.textContent = "Stopping…";
    send("/control", { run: state.run.name, stop: true })
      .catch((problem) => { stop.disabled = false; stop.textContent = "Stop"; tell(problem); });
  });
  const box = card.querySelector(".knobs"), groups = {};
  for (const [heading, names] of KNOB_GROUPS) {
    const group = document.createElement("div");
    group.className = "knob-group";
    group.innerHTML = `<h4>${heading}</h4>`;
    box.append(group);
    for (const name of names) groups[name] = group;
  }
  const groupOf = (name) => {
    if (!groups[name]) throw new Error(`the slider ${name} is in no group`);
    return groups[name];
  };
  for (const knob of KNOBS) {
    const low = Math.min(knob.easiest, knob.hardest), high = Math.max(knob.easiest, knob.hardest);
    const harderIsLess = knob.hardest < knob.easiest;
    const row = document.createElement("div");
    row.className = "knob";
    row.dataset.knob = knob.name;
    row.innerHTML = `<label for="${run.name}-${knob.name}">${knob.label}</label><output></output>
      <input type="range" id="${run.name}-${knob.name}" min="${low}" max="${high}" step="${knob.step}">
      <small><span>${knobFmt(low)} · ${harderIsLess ? "harder" : "easier"}</span><span>${harderIsLess ? "easier" : "harder"} · ${knobFmt(high)}</span></small>`;
    const slider = row.querySelector("input"), shown = row.querySelector("output");
    slider.addEventListener("pointerdown", () => { state.dragging = knob.name; });
    slider.addEventListener("input", () => { shown.textContent = knobFmt(+slider.value); });
    slider.addEventListener("change", () => { state.dragging = null; change(knob.name, +slider.value); });
    groupOf(knob.name).append(row);
  }
  const changeRule = (name, value) => {
    state.pending[name] = { value, until: Date.now() + PENDING_FOR };
    send("/control", { run: state.run.name, rules: { [name]: value } })
      .then(() => tell(null), (problem) => { delete state.pending[name]; tell(problem); updateCard(state); });
  };
  for (const [name, label] of SENSE_COSTS) {
    const row = document.createElement("div");
    row.className = "knob sense-cost";
    row.dataset.rule = name;
    row.innerHTML = `<label for="${run.name}-${name}">${label}</label><output></output>
      <input type="range" id="${run.name}-${name}" disabled>
      <small><span class="low"></span><span class="pays"></span><span class="high"></span></small>`;
    const slider = row.querySelector("input"), shown = row.querySelector("output");
    slider.addEventListener("pointerdown", () => { state.dragging = name; });
    slider.addEventListener("input", () => { shown.textContent = numberText(+slider.value); });
    slider.addEventListener("change", () => { state.dragging = null; changeRule(name, +slider.value); });
    groupOf(name).append(row);
  }
  fetch(`/rules?run=${encodeURIComponent(run.name)}`, { cache: "no-store" }).then((r) => r.json()).then((answer) => {
    for (const row of box.querySelectorAll(".sense-cost")) {  // each slider's range is its rule's allowed range
      const rule = answer.rules.find((r) => r.name === row.dataset.rule), slider = row.querySelector("input");
      Object.assign(slider, { min: rule.low, max: rule.high, step: (rule.high - rule.low) / 1000, disabled: false });
      row.querySelector(".low").textContent = `${numberText(rule.low)} · cheaper`;
      row.querySelector(".high").textContent = `dearer · ${numberText(rule.high)}`;
    }
    updateCard(state);
  }, tell);
  const hunters = card.querySelector("[data-hunters]");
  hunters.addEventListener("change", () => change("hunters", hunters.checked));
  return state;
}

function updateCard(state) {
  const { card, run } = state, last = lastRow(run), manual = run.mode === "manual", now = Date.now();
  for (const button of card.querySelectorAll(".seg button")) button.classList.toggle("on", button.dataset.mode === run.mode);
  const s = scores(run);
  card.querySelector(".where").innerHTML = (run.paused ? '<span class="paused">Paused</span> · ' : "") + (last
    ? `step ${last.step.toLocaleString()} · ${tipped("hardest", `difficulty ${fmt(last.level)}`, { ...s, hardest: last.level, ended: last.level }, run)} · ` +
      `${tipped("end", `${last.population} alive · ${s.fed} % fed`, s, run)} · ` +
      `${tipped("smart", `intelligence ${s.smart === null ? "-" : two(s.smart) + "× random"}`, s, run)}`
    : "starting… (the first numbers come after 250 steps)");
  card.querySelector(".pause").textContent = run.paused ? "Continue" : "Pause";
  updateTiles(state);
  card.querySelector(".hint").textContent = manual
    ? "Manual: only you turn the knobs. A change reaches the world within a second and shows on the charts at the next point."
    : "Auto: every 500 steps the world steers the number alive toward 64 (80 % of the room): harder when above it or rising, easier when below it or falling, by more the further off it is. Switch to Manual to turn the knobs yourself.";
  const shownValue = (name, fromRow, close) => {  // a value moved by hand is shown until the world's row confirms it
    const pending = state.pending[name];
    if (!pending) return fromRow;
    if (now > pending.until || close(fromRow, pending.value)) { delete state.pending[name]; return fromRow; }
    return pending.value;
  };
  card.querySelectorAll(".knob[data-knob]").forEach((row) => {
    const knob = KNOBS.find((k) => k.name === row.dataset.knob), slider = row.querySelector("input");
    slider.disabled = !manual;
    if (state.dragging === knob.name) return;
    const value = shownValue(knob.name, last ? last[knob.name] : knob.start, (a, b) => Math.abs(a - b) <= knob.step);
    slider.value = value;
    row.querySelector("output").textContent = knobFmt(value);
  });
  const hunters = card.querySelector("[data-hunters]");
  hunters.checked = shownValue("hunters", last ? !!last.hunters : false, (a, b) => a === b);
  const live = state.now && state.now.rules ? state.now : null;
  card.querySelectorAll(".sense-cost").forEach((row) => {  // the senses' prices, from the world's live numbers
    const [name, , area] = SENSE_COSTS.find(([n]) => n === row.dataset.rule), slider = row.querySelector("input");
    if (!live || state.dragging === name) return;
    const value = shownValue(name, live.rules[name], (a, b) => Math.abs(a - b) <= +slider.step);
    slider.value = value;
    row.querySelector("output").textContent = numberText(value);
    row.querySelector(".pays").textContent = live.genes && live.genes.vision_width
      ? `the average creature pays ${numberText(value * area(live.genes))} a step` : "";
  });
}

function drawWorlds(running) {
  const box = document.getElementById("worlds"), names = new Set(running.map((r) => r.name));
  if (watching && !names.has(watching.name)) jumpOut();  // the watched world ended
  for (const name of [...cards.keys()]) if (!names.has(name)) { cards.get(name).card.remove(); cards.delete(name); }
  for (const run of running) {
    if (!cards.has(run.name)) { cards.set(run.name, makeCard(run)); box.append(cards.get(run.name).card); }
    const state = cards.get(run.name);
    state.run = run;
    updateCard(state);
  }
  const full = running.length >= 2, note = document.getElementById("start-error");
  document.getElementById("start-go").disabled = full;
  if (full) say(note, "2 worlds are running: stop one to start another.", "full");
  else if (note.dataset.kind === "full" || (note.dataset.kind === "starting" && running.every((r) => r.rows.length)))
    say(note, "", "");  // the note is out of date
}

// ---- Live tiles: the world's numbers right now, every second ----
const NOW_EVERY_MS = 1000, SAMPLES_KEPT = 300;  // one look a second; the energy line covers the last 5 minutes
const TILES = [
  ["step", "Step"], ["alive", "Alive"], ["energy", "Average energy"], ["smart", "Intelligence × random"],
  ["hardest", "Difficulty"], ["steer", "Steers to food"], ["born", "Born"], ["died", "Died"], ["generation", "Generation"],
  ["flee", "Flees bigger"], ["chase", "Chases smaller"], ["size", "Size"], ["brain", "Brain (neurons)"],
  ["vision", "Sees (degrees)"], ["reach", "Sees how far"], ["hearing", "Hears how far"], ["fear", "Fear of death"],
  ["love", "Love of babies"], ["learns", "Learns from others"], ["mutations", "Genes a baby changes"],
  ["mutation_size", "How much each changes"],
];

function makeTiles(state) {
  const box = document.createElement("div");
  box.className = "tiles";
  box.innerHTML = '<div class="head">Right now · updates every second</div>' + TILES.map(([key, label]) =>
    `<div class="tile" data-tile="${key}"><span>${label}</span><strong data-tip="">-</strong><small></small></div>`).join("") +
    '<svg viewBox="0 0 300 56" preserveAspectRatio="none" role="img" aria-label="Average energy over the last minutes"></svg>' +
    '<small class="line-note"></small>';
  state.tiles = box;
  return box;
}

async function pollNow(state) {
  if (state.run.paused && state.now) return updateTiles(state);
  const response = await fetch(`/now?run=${encodeURIComponent(state.run.name)}`, { cache: "no-store" }).catch(() => null);
  if (!response || !response.ok) return updateTiles(state);
  const now = await response.json();
  if (now === null) return updateTiles(state);  // no live numbers yet: the tiles use the scoreboard
  state.now = now;
  const last = state.samples[state.samples.length - 1];
  if (!last || last.step !== state.now.step) state.samples.push(state.now);
  if (state.samples.length > SAMPLES_KEPT) state.samples.shift();
  updateTiles(state);
}

const meanOf = (rows, key) => {
  const known = rows.map((r) => r[key]).filter((v) => v !== null && v !== undefined);
  return known.length ? known.reduce((total, v) => total + v, 0) / known.length : null;
};

function liveNumbers(state) {
  const { run, now, samples } = state, last = lastRow(run), s = scores(run);
  const recentRows = last ? run.rows.filter((r) => r.step > last.step - 1000) : [];
  const sum = (key) => recentRows.reduce((total, r) => total + r[key], 0);
  const back = now && samples.find((x) => x.step >= now.step - 1000);  // the sample about 1,000 steps ago
  const spanned = now && back && now.step - back.step >= 900;
  const earlier = now && samples.find((x) => x.time >= now.time - 5);
  return {
    ...s,
    step: now ? now.step : last ? last.step : 0,
    speed: now && earlier && now.time > earlier.time ? (now.step - earlier.step) / (now.time - earlier.time) : null,
    alive: now ? now.alive : s.alive,
    fed: now && now.energy !== null ? Math.round(now.energy * 100) : s.fed,
    fedBefore: spanned && back.energy !== null ? Math.round(back.energy * 100) : null,
    born: spanned ? now.births - back.births : last ? sum("births") : null,
    died: spanned ? now.deaths - back.deaths : last ? sum("deaths_hunger") + sum("deaths_attack") + sum("deaths_age") : null,
    food: now ? now.food : null,
    flee: meanOf(recentRows, "flee"), chase: meanOf(recentRows, "chase"),
    vision_width: meanOf(recentRows, "vision_width"), vision_reach: meanOf(recentRows, "vision_reach"),
    hearing: meanOf(recentRows, "hearing"),
    fear: meanOf(recentRows, "fear_of_death"), love: meanOf(recentRows, "love_of_babies"),
    learns: meanOf(recentRows, "learns_from_others"), neurons: meanOf(recentRows, "neurons"),
    layers: meanOf(recentRows, "layers"),
  };
}

function updateTiles(state) {
  if (!state.tiles) return;
  const n = liveNumbers(state), run = state.run;
  const set = (key, value, note, tip, cls = "") => {
    const tile = state.tiles.querySelector(`[data-tile="${key}"]`), strong = tile.querySelector("strong");
    strong.textContent = value;
    strong.className = cls;
    strong.dataset.tip = tip;
    tile.querySelector("small").textContent = note;
  };
  set("step", n.step.toLocaleString(), n.speed === null ? (run.paused ? "paused" : "") : `${Math.round(n.speed)} steps a second`,
      `How many steps this world has lived. It runs ${n.speed === null ? "-" : Math.round(n.speed)} steps a second right now.`);
  set("alive", n.alive === null ? "-" : n.alive, "of 80 room",
      `${n.alive} creatures are alive. The world has room for 80; when it is full, no more babies are born until someone dies.`,
      n.alive !== null && n.alive < 30 ? "bad" : "");
  set("energy", n.fed === null ? "-" : `${n.fed} %`, n.fedBefore === null ? "of a full tank" : `${n.fed >= n.fedBefore ? "up" : "down"} from ${n.fedBefore} %`,
      `On average each creature has ${n.fed} % of a full tank of energy. At 70 % a creature has a baby; past its lifespan, ` +
      `below 30 % it dies. Auto makes the world harder while most are well fed (50 % or more) and easier below 35 %.`,
      n.fedBefore === null ? "" : n.fed > n.fedBefore ? "good" : n.fed < n.fedBefore ? "bad" : "");
  set("smart", n.smart === null ? "-" : `${two(n.smart)}×`, n.smartWas === null ? "first test at 2,000 steps" : `random · was ${two(n.smartWas)}×`,
      explain("smart", n, run), n.smart === null ? "" : n.smart >= 1 ? "good" : "bad");
  set("hardest", n.ended === null ? "-" : fmt(n.ended), run.mode === "manual" ? "Manual: you set it" : "Auto turns it",
      explain("hardest", { ...n, hardest: n.ended }, run));
  set("steer", two(n.steer), "0 = random", explain("steer", n, run), n.steer === null ? "" : n.steer >= 0.2 ? "good" : n.steer < 0 ? "bad" : "");
  set("born", n.born === null ? "-" : n.born, "last 1,000 steps",
      `${n.born} babies were born in the last 1,000 steps. A creature has a baby when it reaches 70 % of a full tank.`);
  set("died", n.died === null ? "-" : n.died, "last 1,000 steps",
      `${n.died} creatures died in the last 1,000 steps. Only creatures low on energy die: their energy ran out, or they ` +
      `were past their lifespan with less than 30 %.`);
  set("generation", n.generation === null ? "-" : n.generation, "deepest alive", explain("generation", n, run));
  const share = (v) => v === null ? "-" : `${Math.round(v * 100)} %`;
  set("flee", share(n.flee), "away from a bigger one",
      `When a bigger creature is in sight, the share of moves away from it, over the last 1,000 steps: ` +
      `${share(n.flee)}. Running away is how prey survives hunters. "-" while no bigger creature was in sight (or hunters are off).`,
      n.flee === null ? "" : n.flee >= 0.5 ? "good" : "bad");
  set("chase", share(n.chase), "toward a smaller one",
      `When a smaller creature is in sight, the share of moves toward it, over the last 1,000 steps: ` +
      `${share(n.chase)}. Chasing is how a hunter eats. "-" while no smaller creature was in sight.`,
      n.chase === null ? "" : n.chase >= 0.5 ? "good" : "");
  // the genes of the living, each as its average with the lowest and highest (from the world's live numbers)
  const spread = (key) => state.now && state.now.genes ? state.now.genes[key] : null;
  const geneTile = (tile, key, digits, unit, words) => {
    const g = spread(key), show = (v) => `${v.toFixed(digits)}${unit}`;
    set(tile, g ? show(g[1]) : "-", g ? `min ${show(g[0])} · max ${show(g[2])}` : "",
        g ? `${words}: average ${show(g[1])}, lowest ${show(g[0])}, highest ${show(g[2])} among the living. In the genes; evolution moves it.`
          : "No numbers yet.");
  };
  geneTile("size", "size", 2, "", "Body size");
  geneTile("brain", "neurons", 0, "", "Neurons in a brain (each costs energy every step)");
  geneTile("vision", "vision_width", 0, "°", "Vision cone width");
  geneTile("reach", "vision_reach", 1, "", "How far it sees");
  geneTile("hearing", "hearing", 1, "", "How far it hears, all around");
  geneTile("fear", "fear_of_death", 1, "", "Fear of death (a bite = 1)");
  geneTile("love", "love_of_babies", 1, "", "Love of babies (a bite = 1)");
  geneTile("learns", "learns_from_others", 2, "", "Learning from others (1 = as much as from its own step)");
  geneTile("mutations", "mutations", 1, "", "How many genes each baby changes (the rest are copied exactly)");
  geneTile("mutation_size", "mutation_size", 3, "", "How much each changed gene of a baby changes, either way (0.05 = 5 %)");
  const points = state.samples.filter((x) => x.energy !== null);
  const svg = state.tiles.querySelector("svg");
  if (points.length > 1) {
    const x0 = points[0].step, x1 = points[points.length - 1].step || x0 + 1;
    const line = points.map((p) => `${((p.step - x0) / Math.max(1, x1 - x0) * 300).toFixed(1)},${(52 - p.energy * 48).toFixed(1)}`).join(" ");
    svg.innerHTML = `<line x1="0" x2="300" y1="${52 - 0.7 * 48}" y2="${52 - 0.7 * 48}" stroke="var(--grid)" stroke-dasharray="3 3"/>` +
      `<polyline points="${line}" fill="none" stroke="${colorOf(run.kind)}" stroke-width="2" vector-effect="non-scaling-stroke"/>`;
    state.tiles.querySelector(".line-note").textContent = `Average energy, the last ${Math.round((points[points.length - 1].time - points[0].time) / 60) || "<1"} min (dashed: 70 %, enough for a baby)`;
  }
}

// ---- Saves: every world saves itself every 2,000 steps; any save can go on as a new world ----
const SAVES_EVERY = 10000;  // ms between two looks at a running world's saves
const startedAt = (name) => { const time = name.split("-")[1]; return `${time.slice(0, 2)}:${time.slice(2, 4)}`; };  // folder names start with the date and time
const title = (run) => `${run.kind} · seed ${run.seed}` + (run.from ? ` · from the ${startedAt(run.from.run)} world at ${thousands(run.from.step)}` : "");

function resumePicker(run, tell) {
  const box = document.createElement("div");
  box.className = "resume";
  box.innerHTML = `<span>Saves</span><select aria-label="Save"><option value="">none yet</option></select>
    <select aria-label="Mode"><option value="auto">Auto</option><option value="manual">Manual</option></select>
    <button type="button" class="act" disabled>Start a new world from this save</button>`;
  const [steps, mode] = box.querySelectorAll("select"), go = box.querySelector("button");
  const load = async () => {
    const found = await (await fetch(`/saves?run=${encodeURIComponent(run.name)}`, { cache: "no-store" })).json().catch(() => []);
    if (!Array.isArray(found) || !found.length) return;
    const chosen = steps.value;
    steps.replaceChildren(...found.slice().reverse().map((step) => new Option(`step ${step.toLocaleString()}`, step)));
    if (found.includes(Number(chosen))) steps.value = chosen;
    go.disabled = false;
  };
  go.addEventListener("click", async () => {
    go.disabled = true;
    try {
      await send("/start", { from: { run: run.name, step: Number(steps.value) }, mode: mode.value });
      tell(null);
      show("live");
      signature = "";
      await poll();
    } catch (problem) { tell(problem); } finally { go.disabled = false; }
  });
  load();
  if (run.status === "running") {  // a running world gets a new save every 2,000 steps
    const timer = setInterval(() => box.isConnected ? load() : clearInterval(timer), SAVES_EVERY);
  }
  return box;
}

// ---- Jump into a world: watch it slowly, then back to full speed ----
const VIEW_EVERY = 100, RENEW_EVERY = 2000;  // ms: the picture 10 times a second; the slow mode renewed every 2 s
let watching = null;  // {name, kind, timers}

// The legend: each meaning drawn by the same code as the world's picture.
// The index: the colours, what a creature is doing, and its body's symbols; each drawn by the picture's own code.
const PLAIN = { energy: 0.7, age: 1500, lifespan: 5000, earned: 30, spent: 30, did: "MOVE", intent: "WANDER", facing: [1, 0],
                vision_width: 70, vision_reach: 3, hearing: 1, fear_of_death: 3, love_of_babies: 10, learns_from_others: 0.2,
                neurons: 32, layers: 1, learning_speed: 3e-4 };
const INDEX = [
  ["Colour", [["full: green", { ...PLAIN, energy: 0.9 }], ["half: yellow", { ...PLAIN, energy: 0.45 }],
              ["hungry: red", { ...PLAIN, energy: 0.08 }], ["arc: its age", { ...PLAIN, age: 3800 }],
              ["dotted: past, its lifespan", { ...PLAIN, age: 5400, energy: 0.25 }]]],
  ["Doing", [["eating", { ...PLAIN, did: "EAT" }], ["eating at, nothing", { ...PLAIN, did: "EAT_MISS" }],
             ["attacking: a strike, line to its target", { ...PLAIN, did: "ATTACK", strike: true }],
             ["hit", { ...PLAIN, did: "HIT_BY_ATTACK" }], ["chasing", { ...PLAIN, intent: "CHASE" }],
             ["fleeing", { ...PLAIN, intent: "RUN_AWAY" }], ["had a baby", { ...PLAIN, baby: true }]]],
  ["Body", [["wide-set eyes:, wide cone", { ...PLAIN, vision_width: 120 }], ["big eyes:, sees far", { ...PLAIN, vision_reach: 9 }],
            ["big ears:, hears far", { ...PLAIN, hearing: 3.5 }], ["big head:, many neurons", { ...PLAIN, neurons: 64 }],
            ["folds:, brain layers", { ...PLAIN, neurons: 64, layers: 3 }], ["quills:, fears death", { ...PLAIN, fear_of_death: 80 }]]],
  ["", [["round:, loves babies", { ...PLAIN, love_of_babies: 100 }], ["antennae:, learns from others", { ...PLAIN, learns_from_others: 1 }],
        ["stripes:, learns fast", { ...PLAIN, learning_speed: 5e-3 }],
        ["cone:, what it sees", { ...PLAIN, vision_width: 110, vision_reach: 1.5, hearing: 0, senses: true }],
        ["dotted circle:, what it hears", { ...PLAIN, vision_reach: 0, hearing: 1.5, senses: true }], ["food", { food: true }]]],
];
const INDEX_ROW = 104, INDEX_LABEL = 64;

function drawLegend() {
  const canvas = document.getElementById("watch-legend"), ink = getComputedStyle(document.documentElement);
  const color = (name) => ink.getPropertyValue(name).trim(), dpr = devicePixelRatio;
  const perRow = Math.max(...INDEX.map(([, items]) => items.length));
  canvas.style.height = `${INDEX.length * INDEX_ROW}px`;
  const width = canvas.clientWidth * dpr, height = INDEX.length * INDEX_ROW * dpr;
  canvas.width = width; canvas.height = height;
  const g = canvas.getContext("2d"), cell = (width - INDEX_LABEL * dpr) / perRow, unit = Math.min(cell / 5, 12 * dpr);
  const line = Math.max(1.2, dpr * 1.2);
  INDEX.forEach(([title, items], row) => {
    const top = row * INDEX_ROW * dpr;
    g.fillStyle = color("--ink"); g.font = `600 ${12 * dpr}px system-ui, sans-serif`; g.textAlign = "left";
    g.fillText(title, 4 * dpr, top + 38 * dpr);
    g.font = `${11 * dpr}px system-ui, sans-serif`; g.textAlign = "center";
    items.forEach(([words, c], i) => {
      const x = INDEX_LABEL * dpr + cell * (i + 0.5), y = top + 34 * dpr, r = unit * 1.1;
      if (c.food) {
        const d = 5 * dpr; g.fillStyle = FOOD_COLOUR;
        g.beginPath(); g.moveTo(x, y - d); g.lineTo(x + d, y); g.lineTo(x, y + d); g.lineTo(x - d, y); g.closePath(); g.fill();
      } else {
        if (c.senses) drawSenses(g, x, y, c, Math.min(cell * 0.18, 18 * dpr), true, color);
        const cx = c.strike ? x - cell * 0.18 : x;
        drawCreature(g, cx, y, r, c, 1.0, line, color);
        if (c.strike) {
          const target = { ...PLAIN, did: "HIT_BY_ATTACK" }, tx = x + cell * 0.25;
          drawCreature(g, tx, y, r * 0.7, target, 1.0, line, color);
          drawStrike(g, { x: cx, y, r }, { x: tx, y, r: r * 0.7 }, line, true);
        }
      }
      g.fillStyle = color("--muted");
      words.split(", ").forEach((part, k) => g.fillText(part, x, y + (34 + 12 * k) * dpr));
    });
  });
}

async function jumpIn(run) {
  if (watching) await jumpOut();
  const speed = Number(document.getElementById("watch-speed").value);
  await send("/control", { run: run.name, watch: true, watch_speed: speed });
  watching = { name: run.name, kind: run.kind, timers: [] };
  document.getElementById("watch-title").innerHTML = `${swatch(run.kind)}Inside ${run.kind} · seed ${run.seed}`;
  document.getElementById("watch-where").textContent = "waiting for the first picture…";
  document.getElementById("watch").hidden = false;
  drawLegend();
  const renew = () => watching && send("/control", { run: watching.name, watch: true,
    watch_speed: Number(document.getElementById("watch-speed").value) }).catch(() => {});
  watching.timers.push(setInterval(renew, RENEW_EVERY), setInterval(fetchView, VIEW_EVERY));
  requestAnimationFrame(paint);
}

async function jumpOut() {
  if (!watching) return;
  const name = watching.name;
  watching.timers.forEach(clearInterval);
  watching = null;
  document.getElementById("watch").hidden = true;
  await send("/control", { run: name, watch: false }).catch(() => {});  // a world already ended needs no telling
}

async function fetchView() {
  if (!watching) return;
  const response = await fetch(`/view?run=${encodeURIComponent(watching.name)}`, { cache: "no-store" }).catch(() => null);
  if (!response || !response.ok || !watching) return;
  const picture = await response.json();
  if (watching.cur && picture.step === watching.cur.step) return;
  const now = performance.now();
  watching.span = watching.curAt ? Math.min(1000, now - watching.curAt) : VIEW_EVERY;  // glide over the time between pictures
  watching.prev = watching.cur;
  watching.cur = picture;
  watching.curAt = now;
  document.getElementById("watch-where").textContent =
    `step ${picture.step.toLocaleString()} · ${picture.creatures.length} alive · ${picture.foods.length} food`;
}

// Hunger as a colour: red when empty, yellow at half, green from 70 % of a full tank (enough for a baby).
const HUNGER = [[0, [226, 75, 74]], [0.35, [237, 161, 0]], [0.7, [27, 175, 122]]];
function hungerColour(energy) {
  const e = Math.max(0, Math.min(1, energy));
  for (let i = 1; i < HUNGER.length; i++) {
    const [at, rgb] = HUNGER[i], [was, from] = HUNGER[i - 1];
    if (e <= at) {
      const t = (e - was) / (at - was);
      return `rgb(${from.map((v, k) => Math.round(v + (rgb[k] - v) * t)).join(",")})`;
    }
  }
  return `rgb(${HUNGER[HUNGER.length - 1][1].join(",")})`;
}

const FOOD_COLOUR = "#b4977a", MIN_SPENT = 5;  // a creature's intelligence is shown once it has spent this much
const SIGN = { eat: "#2fbf71", miss: "#e0a23a", attack: "#e5484d", baby: "#e889b8", chase: "#e8873a", flee: "#f5d547" };

function creatureSmarts(c, wanderers) {  // its own energy earned ÷ spent, against the random wanderers' in the last exam
  return c.spent >= MIN_SPENT && wanderers ? (c.earned / c.spent) / wanderers : null;
}

// A creature's shape from its genes (the Creature Shapes page): every measure in body radii. Body colour stays hunger.
function creatureShape(c) {
  const width = c.vision_width ?? 90, reach = c.vision_reach ?? 3, love = Math.log10(Math.max(c.love_of_babies ?? 10, 1));
  const fear = Math.log10(Math.max(c.fear_of_death ?? 10, 1)), speed = Math.log10(c.learning_speed ?? 3e-4);
  return {
    eyeAngle: 0.18 + Math.max(0, Math.min(90, width - 30)) / 90 * 0.95,  // wide cone: eyes round the sides
    eyeSize: 0.1 + reach * 0.022,  // big eyes see far
    earSize: 0.12 + (c.hearing ?? 0) * 0.09,  // big ears hear far
    headSize: 0.22 + Math.min(c.neurons || 0, 192) / 64 * 0.38 / Math.max(1, (c.layers || 1) * 0.6),  // neurons
    folds: c.layers || 0,  // one fold a layer
    quills: Math.round(Math.min(fear, 2) * 3.5), quillLength: 0.18 * (0.5 + Math.min(fear, 2) / 2),  // fear of death
    roundness: 2 + (2 - Math.min(love, 2)) * 1.6,  // love of babies: round and soft, or angular
    antennae: (c.learns_from_others ?? 0) * 1.3,  // learns from others
    stripes: Math.max(0, Math.round((speed + 5) / 3 * 5)),  // learning speed
  };
}

// What it is doing, in the creature's own frame (it faces +x): rings for eating and a baby, red spikes when hit, speed
// lines with an arrow (chasing) or a ! (fleeing). Attacking is the strike line, drawn between the two by the picture.
function drawDoing(g, r, c, line, color) {
  const ring = (colour, dashed) => {
    g.strokeStyle = colour; g.lineWidth = line * 1.8;
    if (dashed) g.setLineDash([line * 2, line * 2]);
    g.beginPath(); g.arc(0, 0, r * 1.3, 0, Math.PI * 2); g.stroke(); g.setLineDash([]);
  };
  if (c.did === "EAT") {
    ring(SIGN.eat);
    g.fillStyle = FOOD_COLOUR;
    for (const [dx, dy] of [[1.5, -0.5], [1.8, 0.3], [1.4, 0.6]]) { g.beginPath(); g.arc(r * dx, r * dy, Math.max(1, r * 0.12), 0, Math.PI * 2); g.fill(); }
  }
  if (c.did === "EAT_MISS") ring(SIGN.miss, true);
  if (c.baby) ring(SIGN.baby);
  if (c.did === "HIT_BY_ATTACK") {
    g.strokeStyle = SIGN.attack; g.lineWidth = line * 1.4;
    for (let i = 0; i < 8; i++) {
      const a = i / 8 * Math.PI * 2;
      g.beginPath(); g.moveTo(Math.cos(a) * r * 1.3, Math.sin(a) * r * 1.3); g.lineTo(Math.cos(a) * r * 1.75, Math.sin(a) * r * 1.75); g.stroke();
    }
  }
  if (c.intent === "CHASE" || c.intent === "RUN_AWAY") {
    g.strokeStyle = color("--muted"); g.lineWidth = line; g.globalAlpha = 0.7;
    for (const dy of [-0.4, 0, 0.4]) { g.beginPath(); g.moveTo(-r * 1.35, dy * r); g.lineTo(-r * 2.3, dy * r); g.stroke(); }
    g.globalAlpha = 1;
    if (c.intent === "CHASE") {
      g.fillStyle = SIGN.chase;
      g.beginPath(); g.moveTo(r * 1.5, -r * 0.35); g.lineTo(r * 2.2, 0); g.lineTo(r * 1.5, r * 0.35); g.closePath(); g.fill();
    } else {
      g.save(); g.rotate(-Math.atan2(...(c.facing || [1, 0]).slice().reverse()));  // the ! stays upright
      g.fillStyle = SIGN.flee; g.font = `bold ${Math.max(9, r * 1.1)}px system-ui, sans-serif`; g.textAlign = "center";
      g.fillText("!", 0, -r * 1.35); g.restore();
    }
  }
}

// Attacking: a red strike line from the attacker to the one it went for; a star where it lands (none when it missed).
function drawStrike(g, from, to, line, landed) {
  const dx = to.x - from.x, dy = to.y - from.y, d = Math.hypot(dx, dy) || 1, ux = dx / d, uy = dy / d;
  const sx = from.x + ux * from.r * 1.1, sy = from.y + uy * from.r * 1.1, ex = to.x - ux * to.r * 1.2, ey = to.y - uy * to.r * 1.2;
  g.strokeStyle = SIGN.attack; g.lineWidth = line * 2;
  if (!landed) g.setLineDash([line * 2, line * 2]);
  g.beginPath(); g.moveTo(sx, sy); g.lineTo(ex, ey); g.stroke(); g.setLineDash([]);
  const head = Math.max(4, from.r * 0.5);
  g.fillStyle = SIGN.attack;
  g.beginPath(); g.moveTo(ex, ey); g.lineTo(ex - ux * head - uy * head * 0.6, ey - uy * head + ux * head * 0.6);
  g.lineTo(ex - ux * head + uy * head * 0.6, ey - uy * head - ux * head * 0.6); g.closePath(); g.fill();
  if (landed) {
    g.fillStyle = SIGN.flee; g.beginPath();
    for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2, rr = (i % 2 ? 0.25 : 0.6) * to.r; g.lineTo(to.x + Math.cos(a) * rr, to.y - to.r * 1.1 + Math.sin(a) * rr); }
    g.closePath(); g.fill();
  }
}

// One creature, its shape from its genes, turned where it faces; hunger the body's colour, age the arc (a dotted ring
// once past it), what it just did the flash ring. Used by the world's picture and by its legend.
function drawCreature(g, x, y, r, c, wanderers, line, color) {
  const s = creatureShape(c), [fx, fy] = c.facing || c.heading || [1, 0];
  const lived = c.lifespan ? c.age / c.lifespan : 0;
  g.save();
  g.translate(x, y);
  g.rotate(Math.atan2(fy, fx) || 0);
  g.fillStyle = "rgba(0,0,0,0.5)";  // quills along the back
  for (let i = 0; i < s.quills; i++) {
    const a = Math.PI * 0.55 + (s.quills > 1 ? i / (s.quills - 1) : 0.5) * Math.PI * 0.9, len = r * s.quillLength;
    g.beginPath(); g.moveTo(Math.cos(a - 0.08) * r * 0.95, Math.sin(a - 0.08) * r * 0.95);
    g.lineTo(Math.cos(a) * (r + len), Math.sin(a) * (r + len));
    g.lineTo(Math.cos(a + 0.08) * r * 0.95, Math.sin(a + 0.08) * r * 0.95); g.closePath(); g.fill();
  }
  for (const side of [-1, 1]) {  // ears
    const er = r * s.earSize;
    g.fillStyle = "rgba(0,0,0,0.5)"; g.beginPath(); g.ellipse(-r * 0.15, side * r * 0.92, er * 0.75, er, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#f2c9b8"; g.beginPath(); g.ellipse(-r * 0.15, side * r * 0.92, er * 0.42, er * 0.62, 0, 0, Math.PI * 2); g.fill();
  }
  g.fillStyle = hungerColour(c.energy);  // the body: hunger its colour, love of babies its roundness
  g.beginPath();
  for (let t = 0; t <= 48; t++) {
    const a = t / 48 * Math.PI * 2, ca = Math.cos(a), sa = Math.sin(a);
    const px = r * Math.sign(ca) * Math.abs(ca) ** (2 / s.roundness), py = r * 0.92 * Math.sign(sa) * Math.abs(sa) ** (2 / s.roundness);
    t ? g.lineTo(px, py) : g.moveTo(px, py);
  }
  g.closePath();
  g.fillStyle = c.did === "HIT_BY_ATTACK" ? SIGN.attack : hungerColour(c.energy);  // hit: it turns red
  g.fill();
  g.lineWidth = line; g.strokeStyle = "rgba(0,0,0,0.35)"; g.stroke();
  g.strokeStyle = "rgba(0,0,0,0.45)"; g.lineWidth = Math.max(0.8, r * 0.05);  // stripes: learning speed
  for (let i = 0; i < s.stripes; i++) {
    const sx = -r * (0.2 + i * 0.13);
    g.beginPath(); g.moveTo(sx, -r * 0.55); g.lineTo(sx - r * 0.06, r * 0.55); g.stroke();
  }
  if (s.folds) {  // the head: neurons its size, layers its folds
    const hx = r * 0.12, hr = r * s.headSize;
    g.fillStyle = "rgba(0,0,0,0.22)"; g.beginPath(); g.ellipse(hx, 0, hr * 1.1, hr, 0, 0, Math.PI * 2); g.fill();
    g.strokeStyle = "rgba(0,0,0,0.45)"; g.lineWidth = Math.max(0.8, r * 0.035);
    for (let i = 0; i < s.folds; i++) {
      const fold = hx - hr * 0.6 + (i + 1) * (hr * 1.2) / (s.folds + 1);
      g.beginPath(); g.moveTo(fold, -hr * 0.8); g.quadraticCurveTo(fold + hr * 0.25, 0, fold, hr * 0.8); g.stroke();
    }
  }
  const ant = s.antennae * r;  // antennae: learns from others
  if (ant > 1) {
    g.strokeStyle = color("--ink"); g.lineWidth = Math.max(0.8, line * 0.8);
    for (const side of [-1, 1]) {
      g.beginPath(); g.moveTo(r * 0.55, side * r * 0.25);
      g.quadraticCurveTo(r * 0.9, side * (r * 0.25 + ant * 0.5), r * 0.55 + ant, side * (r * 0.35 + ant * 0.6)); g.stroke();
    }
  }
  for (const side of [-1, 1]) {  // eyes: spacing from the cone's width, size from its reach
    const ex = Math.cos(s.eyeAngle * side) * r * 0.66, ey = Math.sin(s.eyeAngle * side) * r * 0.66, er = r * s.eyeSize;
    g.fillStyle = "#ffffff"; g.beginPath(); g.arc(ex, ey, er, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#111111"; g.beginPath(); g.arc(ex + er * 0.35, ey, er * 0.55, 0, Math.PI * 2); g.fill();
  }
  drawDoing(g, r, c, line, color);
  g.restore();
  g.strokeStyle = color("--muted"); g.lineWidth = line;  // age: an arc of its own lifespan
  g.beginPath(); g.arc(x, y, r * 1.25 + line * 2, -Math.PI / 2, -Math.PI / 2 + 2 * Math.PI * Math.min(1, lived)); g.stroke();
  if (lived >= 1) {  // past its lifespan: a dotted outer ring
    g.setLineDash([line, line * 2]);
    g.beginPath(); g.arc(x, y, r * 1.25 + line * 4, 0, 2 * Math.PI); g.stroke();
    g.setLineDash([]);
  }
  return creatureSmarts(c, wanderers);
}

// What a creature senses: its vision cone, a faint wedge of its body colour where it faces, and its hearing, a faint
// dotted circle all around. `strong` for the creature pointed at (and the legend).
function drawSenses(g, x, y, c, unit, strong, color) {
  if (c.vision_width === undefined) return;  // a picture from a world still on code from before senses were genes
  const [fx, fy] = c.facing, mid = Math.atan2(fy, fx), half = c.vision_width / 360 * Math.PI;
  g.save();
  g.globalAlpha = strong ? 0.16 : 0.06;
  g.fillStyle = hungerColour(c.energy);
  g.beginPath();
  if (c.vision_width >= 360) g.arc(x, y, c.vision_reach * unit, 0, 2 * Math.PI);
  else { g.moveTo(x, y); g.arc(x, y, c.vision_reach * unit, mid - half, mid + half); g.closePath(); }
  g.fill();
  if (c.hearing > 0) {
    g.globalAlpha = strong ? 0.6 : 0.22;
    g.strokeStyle = color("--muted");
    g.lineWidth = devicePixelRatio;
    g.setLineDash([2 * devicePixelRatio, 4 * devicePixelRatio]);
    g.beginPath(); g.arc(x, y, c.hearing * unit, 0, 2 * Math.PI); g.stroke();
  }
  g.restore();
}

// The camera: how far it is zoomed, which point of the world is in the middle, and the creature it follows (if any).
const ZOOMS = { least: 1, most: 12, follow: 4, step: 1.25 };
const camera = { zoom: 1, x: null, y: null, follow: null, pov: false };
function zoomBy(factor) {
  camera.zoom = Math.max(ZOOMS.least, Math.min(ZOOMS.most, camera.zoom * factor));
  document.getElementById("zoom-shown").textContent = `${camera.zoom < 10 ? camera.zoom.toFixed(1) : Math.round(camera.zoom)}×`;
}
function follow(id, name) {
  camera.follow = id;
  if (id === null) pov(false);
  showGenes(false);
  document.getElementById("follow-note").hidden = id === null;
  if (id !== null) { document.getElementById("follow-who").textContent = name; if (camera.zoom < ZOOMS.follow) zoomBy(ZOOMS.follow / camera.zoom); }
}

function pov(on) {  // the followed creature's point of view: only what it senses is drawn
  camera.pov = on;
  const button = document.getElementById("follow-pov");
  button.setAttribute("aria-pressed", String(on));
  button.textContent = on ? "POV: on" : "POV";
}

// What `me` senses in `picture`, as the world decides it (src/senses.py): seen when within its vision reach and inside
// its cone; heard when not seen, within its hearing, and it moved in its last step. Food is never heard.
function sensedBy(me, picture) {
  const half = Math.cos(me.vision_width / 2 * Math.PI / 180), [fx, fy] = me.facing;
  const away = (x, y) => Math.hypot(x - me.x, y - me.y);
  const seen = (x, y) => {
    const d = away(x, y);
    return d === 0 || (d <= me.vision_reach && (me.vision_width >= 360 || ((x - me.x) * fx + (y - me.y) * fy) / d >= half));
  };
  const sees = new Set(), hears = new Map(), foods = new Set();
  for (const c of picture.creatures) {
    if (c.id === me.id) continue;
    if (seen(c.x, c.y)) sees.add(c.id);
    else if (c.moved && away(c.x, c.y) <= me.hearing) hears.set(c.id, away(c.x, c.y));
  }
  picture.foods.forEach((f, i) => { if (seen(f.x, f.y)) foods.add(i); });
  return { sees, hears, foods };
}

function drawHeard(g, x, y, unit, distance, color) {  // a sound: a blur where it came from and how far, never its size
  const r = unit * 0.5, blur = g.createRadialGradient(x, y, 0, x, y, r);
  blur.addColorStop(0, "rgba(150, 160, 180, 0.6)");
  blur.addColorStop(1, "rgba(150, 160, 180, 0)");
  g.fillStyle = blur;
  g.beginPath(); g.arc(x, y, r, 0, 2 * Math.PI); g.fill();
  g.fillStyle = color("--muted"); g.textAlign = "center";
  g.font = `${12 * devicePixelRatio / camera.zoom}px system-ui, sans-serif`;
  g.fillText(distance.toFixed(1), x, y - r - 2 * devicePixelRatio / camera.zoom);
}

// The genes the owner may change on the followed creature (as the world names them), with how many digits to show.
const GENE_BOXES = [["size", "Size", 2], ["vision_width", "Vision width (degrees)", 0], ["vision_reach", "Sees how far", 2],
  ["hearing", "Hears how far", 2], ["fear_of_death", "Fear of death", 2], ["love_of_babies", "Love of babies", 2],
  ["learns_from_others", "Learns from others", 2], ["learning_speed", "Learning speed", 6],
  ["mutations", "Genes a baby changes", 0], ["mutation_size", "How much each changes (share)", 3]];

function drawGenes(c) {  // the followed creature's genes as boxes, filled once when the panel opens
  const box = document.querySelector("#genes-panel .gene-boxes");
  const input = (name, label, value) => `<label>${label}<input type="number" step="any" name="${name}" value="${value}"></label>`;
  let html = GENE_BOXES.map(([name, label, digits]) => input(name, label, Number(c[name]).toFixed(digits))).join("");
  if (c.brain) {
    html += input("layers", "Brain layers", c.brain.length);
    html += [0, 1, 2].map((i) => `<label data-layer="${i}"${i < c.brain.length ? "" : " hidden"}>Neurons in layer ${i + 1}
      <input type="number" step="1" name="neurons${i}" value="${c.brain[i] ?? c.brain[0]}"></label>`).join("");
  }
  box.innerHTML = html;
  const layers = box.querySelector('[name="layers"]');
  if (layers) layers.addEventListener("input", () =>
    box.querySelectorAll("[data-layer]").forEach((l) => { l.hidden = +l.dataset.layer >= +layers.value; }));
  document.getElementById("genes-said").textContent = "";
}

function showGenes(open) {
  const panel = document.getElementById("genes-panel"), button = document.getElementById("follow-genes");
  const c = open && watching && watching.cur ? watching.cur.creatures.find((x) => x.id === camera.follow) : null;
  panel.hidden = !c;
  button.setAttribute("aria-expanded", String(!!c));
  if (c) drawGenes(c);
}

function paint() {
  if (!watching) return;
  requestAnimationFrame(paint);
  const picture = watching.cur;
  if (!picture) return;
  const t = watching.prev ? Math.min(1, (performance.now() - watching.curAt) / watching.span) : 1;
  const before = new Map((watching.prev ? watching.prev.creatures : []).map((c) => [c.id, c]));
  const run = data.find((r) => r.name === watching.name), wanderers = run ? scores(run).wanderers : null;
  const canvas = document.getElementById("watch-canvas"), ink = getComputedStyle(document.documentElement);
  const color = (name) => ink.getPropertyValue(name).trim();
  const worldW = picture.width || 50, worldH = picture.height || 30;
  const width = canvas.clientWidth * devicePixelRatio, height = width * worldH / worldW;
  if (canvas.width !== width || canvas.height !== Math.round(height)) { canvas.width = width; canvas.height = height; }
  const unit = width / worldW, g = canvas.getContext("2d"), line = Math.max(1.2, unit * 0.06);
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, canvas.width, canvas.height);
  const placed = picture.creatures.map((c) => {
    const from = before.get(c.id) || c;  // a newborn appears where it is
    return { c, x: (from.x + (c.x - from.x) * t) * unit, y: (from.y + (c.y - from.y) * t) * unit };
  });
  const followed = camera.follow === null ? null : placed.find((p) => p.c.id === camera.follow);
  if (camera.follow !== null && !followed) follow(null);  // it died: the camera stays where it was
  if (followed) { camera.x = followed.x / unit; camera.y = followed.y / unit; }
  if (camera.x === null) { camera.x = worldW / 2; camera.y = worldH / 2; }
  const halfW = worldW / 2 / camera.zoom, halfH = worldH / 2 / camera.zoom;  // keep the view inside the world
  if (!followed) { camera.x = Math.max(halfW, Math.min(worldW - halfW, camera.x)); camera.y = Math.max(halfH, Math.min(worldH - halfH, camera.y)); }
  const toScreen = (x, y) => [(x - camera.x * unit) * camera.zoom + canvas.width / 2, (y - camera.y * unit) * camera.zoom + canvas.height / 2];
  watching.toWorld = (sx, sy) => [((sx * devicePixelRatio - canvas.width / 2) / camera.zoom + camera.x * unit) / unit,
                                  ((sy * devicePixelRatio - canvas.height / 2) / camera.zoom + camera.y * unit) / unit];
  g.setTransform(camera.zoom, 0, 0, camera.zoom, canvas.width / 2 - camera.x * unit * camera.zoom,
                 canvas.height / 2 - camera.y * unit * camera.zoom);
  const sensed = followed && camera.pov ? sensedBy(followed.c, picture) : null;  // its point of view, when on
  const shown = sensed ? placed.filter((p) => p === followed || sensed.sees.has(p.c.id)) : placed;
  if (sensed) {  // what it cannot sense is not drawn; the world around is dimmed
    g.fillStyle = "rgba(0, 0, 0, 0.35)"; g.fillRect(0, 0, worldW * unit, worldH * unit);
    drawSenses(g, followed.x, followed.y, followed.c, unit, true, color);
  } else {
    for (const { c, x, y } of placed) drawSenses(g, x, y, c, unit, c.id === watching.hover, color);  // under everything
  }
  g.fillStyle = FOOD_COLOUR;  // food: small tan diamonds
  for (const food of sensed ? picture.foods.filter((f, i) => sensed.foods.has(i)) : picture.foods) {
    const x = food.x * unit, y = food.y * unit, d = Math.max(food.radius * unit, 2.5);
    g.beginPath(); g.moveTo(x, y - d); g.lineTo(x + d, y); g.lineTo(x, y + d); g.lineTo(x - d, y); g.closePath(); g.fill();
  }
  watching.drawn = [];
  if (sensed) for (const p of placed) if (sensed.hears.has(p.c.id)) drawHeard(g, p.x, p.y, unit, sensed.hears.get(p.c.id), color);
  for (const { c, x, y } of shown) {
    const r = Math.max(c.radius * unit, 4);  // size: its genes, never changes
    const smart = drawCreature(g, x, y, r, c, wanderers, line, color);
    const [sx, sy] = toScreen(x, y);
    watching.drawn.push({ c, x: sx / devicePixelRatio, y: sy / devicePixelRatio, r: r * camera.zoom / devicePixelRatio, smart });
  }
  const where = new Map(watching.drawn.map((d) => [d.c.id, d]));
  for (const { c, x, y } of shown) {  // attacking: strike lines, over the creatures
    if (c.target === null || c.target === undefined || !where.has(c.target)) continue;
    const to = placed.find((p) => p.c.id === c.target), r = Math.max(c.radius * unit, 4), tr = Math.max(to.c.radius * unit, 4);
    drawStrike(g, { x, y, r }, { x: to.x, y: to.y, r: tr }, line, c.did === "ATTACK");
  }
  if (followed) {  // the one it follows: a ring
    g.strokeStyle = color("--ink"); g.lineWidth = line;
    g.beginPath(); g.arc(followed.x, followed.y, Math.max(followed.c.radius * unit, 4) * 1.9, 0, 2 * Math.PI); g.stroke();
  }
  g.setTransform(1, 0, 0, 1, 0, 0);
}

const watchCanvas = document.getElementById("watch-canvas");
watchCanvas.addEventListener("wheel", (event) => {  // zoom toward the pointer (or the followed creature)
  if (!watching || !watching.toWorld) return;
  event.preventDefault();
  const box = watchCanvas.getBoundingClientRect(), [wx, wy] = watching.toWorld(event.clientX - box.left, event.clientY - box.top);
  const before = camera.zoom;
  zoomBy(event.deltaY < 0 ? ZOOMS.step : 1 / ZOOMS.step);
  if (camera.follow === null && camera.x !== null) {  // the point under the pointer stays under it
    camera.x = wx - (wx - camera.x) * before / camera.zoom;
    camera.y = wy - (wy - camera.y) * before / camera.zoom;
  }
}, { passive: false });
const pointers = new Map();
let dragged = false, pinchFrom = null;
