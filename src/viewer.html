watchCanvas.addEventListener("pointerdown", (event) => {
  pointers.set(event.pointerId, [event.clientX, event.clientY]);
  dragged = false;
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinchFrom = { gap: Math.hypot(a[0] - b[0], a[1] - b[1]), zoom: camera.zoom }; }
});
watchCanvas.addEventListener("pointermove", (event) => {
  if (!pointers.has(event.pointerId) || !watching || !watching.toWorld) return;
  const [px, py] = pointers.get(event.pointerId);
  pointers.set(event.pointerId, [event.clientX, event.clientY]);
  if (pointers.size === 2 && pinchFrom) {  // a pinch zooms
    const [a, b] = [...pointers.values()];
    zoomBy(pinchFrom.zoom * Math.hypot(a[0] - b[0], a[1] - b[1]) / pinchFrom.gap / camera.zoom);
    dragged = true;
    return;
  }
  if (camera.follow === null && Math.hypot(event.clientX - px, event.clientY - py) > 0) {  // a drag moves the view
    const [ax, ay] = watching.toWorld(px, py), [bx, by] = watching.toWorld(event.clientX, event.clientY);
    camera.x -= bx - ax; camera.y -= by - ay;
    dragged = dragged || Math.abs(event.movementX) + Math.abs(event.movementY) > 2;
  }
});
const lift = (event) => { pointers.delete(event.pointerId); if (pointers.size < 2) pinchFrom = null; };
watchCanvas.addEventListener("pointerup", lift);
watchCanvas.addEventListener("pointercancel", lift);
watchCanvas.addEventListener("click", (event) => {  // a creature: follow it; empty ground: stop following
  if (dragged || !watching || !watching.drawn) return;
  const box = watchCanvas.getBoundingClientRect(), mx = event.clientX - box.left, my = event.clientY - box.top;
  const hit = watching.drawn.find((d) => Math.hypot(d.x - mx, d.y - my) <= Math.max(d.r * 1.6, 18));  // a generous target: they move
  follow(hit ? hit.c.id : null, hit ? `creature ${hit.c.id} (generation ${hit.c.generation})` : "");
});
document.getElementById("zoom-in").addEventListener("click", () => zoomBy(ZOOMS.step));
document.getElementById("zoom-out").addEventListener("click", () => zoomBy(1 / ZOOMS.step));
document.getElementById("follow-stop").addEventListener("click", () => follow(null));
document.getElementById("follow-pov").addEventListener("click", () => pov(!camera.pov));
document.getElementById("follow-genes").addEventListener("click", () => showGenes(document.getElementById("genes-panel").hidden));
document.getElementById("genes-panel").addEventListener("submit", (event) => {  // the boxes, sent as the creature's genes
  event.preventDefault();
  const form = event.target, said = document.getElementById("genes-said"), genes = {};
  for (const [name] of GENE_BOXES) genes[name] = Number(form.elements[name].value);
  if (form.elements.layers) {
    genes.layers = Number(form.elements.layers.value);
    genes.neurons = [...Array(genes.layers).keys()].map((i) => Number(form.elements[`neurons${i}`].value));
  }
  send("/control", { run: watching.name, edit: { id: camera.follow, genes } })
    .then(() => say(said, "Sent: it changes within a moment.", ""), (problem) => say(said, problem.message, "refused"));
});
document.addEventListener("keydown", (event) => { if (event.key === "Escape" && camera.follow !== null) follow(null); });

document.getElementById("watch-canvas").addEventListener("mousemove", (event) => {  // point at a creature: its numbers
  const tip = document.getElementById("tip");
  if (!watching || !watching.drawn) return;
  const box = event.currentTarget.getBoundingClientRect(), mx = event.clientX - box.left, my = event.clientY - box.top;
  const hit = watching.drawn.find((d) => Math.hypot(d.x - mx, d.y - my) <= Math.max(d.r, 6));
  watching.hover = hit ? hit.c.id : null;
  if (!hit) { tip.style.display = "none"; return; }
  const c = hit.c, did = { EAT: "ate", EAT_MISS: "ate at nothing", ATTACK: "attacked", ATTACK_MISS: "attacked and missed",
    MOVE: "moved", HIT_BY_ATTACK: "was attacked" }[c.did] || "rested";
  tip.textContent = `Size ${c.size.toFixed(2)} (its genes) · energy ${Math.round(c.energy * 100)} % of full · ` +
    `age ${c.age.toLocaleString()} of its ${c.lifespan.toLocaleString()} steps · generation ${c.generation} · ` +
    (hit.smart === null ? "too young to judge its intelligence" : `intelligence ${hit.smart.toFixed(2)}× random (${c.earned.toFixed(0)} energy earned for ${c.spent.toFixed(0)} spent)`) +
    ` · just ${did}` +
    (c.vision_width === undefined ? "" : ` · sees ${Math.round(c.vision_width)}° up to ${c.vision_reach.toFixed(1)} away · ` +
     `hears up to ${c.hearing.toFixed(1)} all around`) +
    (c.layers ? ` · brain: ${c.neurons} neurons in ${c.layers} layer${c.layers > 1 ? "s" : ""}` : "") +
    (c.fear_of_death === undefined ? "" : ` · fears death ${c.fear_of_death.toFixed(1)} · loves babies ` +
     `${c.love_of_babies.toFixed(1)} · learns from others ${c.learns_from_others.toFixed(2)}`);
  tip.style.display = "block";
  tip.style.left = `${Math.min(event.clientX + 12, innerWidth - tip.offsetWidth - 8)}px`;
  tip.style.top = `${event.clientY + 14}px`;
});
document.getElementById("watch-canvas").addEventListener("mouseleave", () => {
  document.getElementById("tip").style.display = "none";
  if (watching) watching.hover = null;
});

document.getElementById("watch-out").addEventListener("click", () => jumpOut());
document.getElementById("watch-speed").addEventListener("input", (event) => {
  document.getElementById("watch-speed-shown").textContent = event.target.value;
});
document.getElementById("watch-speed").addEventListener("change", (event) => {
  if (watching) send("/control", { run: watching.name, watch: true, watch_speed: Number(event.target.value) }).catch(() => {});
});

// ---- History: one row per world, its scores, each explained on hover ----
const KIND_WORDS = { learning: "blue: learning animals (they learn during life)", instinct: "orange: instinct animals (never learn)" };
const COLUMNS = [  // each column's title and what it sorts by
  { key: "world", label: "World", by: (run) => run.started },
  { key: "steps", label: "Steps", by: (run, s) => s.steps },
  { key: "hardest", label: "Hardest survived", by: (run, s) => s.hardest },
  { key: "smart", label: "Intelligence × random", by: (run, s) => s.smart },
  { key: "steer", label: "Steers to food", by: (run, s) => s.steer },
  { key: "generation", label: "Generation", by: (run, s) => s.generation },
  { key: "end", label: "Alive · fed at the end", by: (run, s) => s.alive === null ? null : s.alive * 1000 + s.fed },
  { key: "mode", label: "Mode", by: (run) => run.mode },
  { key: "saves", label: "Saves", by: (run) => run.saves },
];
const SHORTCUTS = { smart: "Smartest first", hardest: "Hardest world survived", world: "Newest first" };
const STEP_FLOORS = [0, 1000, 5000, 10000, 50000];
const NO_FILTERS = { animals: "all", mode: "all", minSteps: 0, smarter: false, withSaves: false };
const KEPT = "life.history";  // the sort and filters, remembered in this browser only
let hist = { sort: "smart", desc: true, ...NO_FILTERS };
try { hist = { ...hist, ...JSON.parse(localStorage.getItem(KEPT) || "{}") }; } catch (error) { /* the page works without it */ }
const keep = () => { try { localStorage.setItem(KEPT, JSON.stringify(hist)); } catch (error) { /* not kept: fine */ } };
const two = (v) => v === null ? "-" : v.toFixed(2);

function scores(run) {
  const rows = run.rows, last = lastRow(run) || null;
  const exams = rows.filter((r) => r.intelligence !== null && r.wanderers);
  const first = exams[0] || null, latest = exams[exams.length - 1] || null;
  const recent = last ? rows.filter((r) => r.step > last.step - 1000 && r.toward_food !== null) : [];
  return {
    steps: last ? last.step : 0, limit: run.steps,
    hardest: rows.length ? Math.max(...rows.map((r) => r.level)) : null, ended: last ? last.level : null,
    brains: latest && latest.intelligence, wanderers: latest && latest.wanderers,
    smart: latest ? latest.intelligence / latest.wanderers : null,
    smartWas: first ? first.intelligence / first.wanderers : null,
    firstBrains: first && first.intelligence, firstWanderers: first && first.wanderers,
    steer: recent.length ? recent.reduce((s, r) => s + r.toward_food, 0) / recent.length : null,
    generation: last ? last.generation : null, alive: last ? last.population : null,
    fed: last && last.energy !== null ? Math.round(last.energy * 100) : null,
  };
}

function explain(what, s, run) {
  const percent = (x) => Math.round(Math.abs(x - 1) * 100);
  switch (what) {
    case "smart":
      if (s.smart === null) return "No intelligence test yet: the first one comes at step 2,000.";
      return `In the test, these creatures got ${two(s.brains)} energy back for each 1 they spent; creatures wandering at ` +
        `random got ${two(s.wanderers)}. That is ${two(s.smart)}× random: ${percent(s.smart)} % ${s.smart >= 1 ? "better" : "worse"} ` +
        `than wandering at random. Above 1× means smarter than random. At the first test it was ${two(s.smartWas)}× ` +
        `(${two(s.firstBrains)} against ${two(s.firstWanderers)}).`;
    case "hardest":
      return `The hardest world these creatures lived through: difficulty ${fmt(s.hardest)}. Difficulty counts how many small ` +
        `5 % nudges harder than the easy start the world was (less food, poorer food, costlier moves and living, shorter ` +
        `lives). Higher means they survived a tougher world.` + (s.ended !== null && s.ended < s.hardest - 0.05
          ? ` It ended at ${fmt(s.ended)}: the world was made easier again because they were struggling.` : "");
    case "steer":
      return s.steer === null ? "No steering measured yet." : `When a creature saw food and moved, how straight it went ` +
        `at it, over the last 1,000 steps: 1 means straight at the food, 0 means no better than random, below 0 means ` +
        `away from it. This world: ${two(s.steer)}.`;
    case "generation":
      return `The most parent-to-baby steps between a creature alive at the end and the first creatures: ${s.generation}. ` +
        `More generations means evolution has had more rounds to work.`;
    case "end":
      return `${s.alive} creatures were alive at the end (80 is the most the world allows). On average each had ${s.fed} % ` +
        `of a full tank of energy: at 70 % a creature has a baby; past its lifespan, below 30 % it dies.`;
    case "steps":
      return `How long this world ran: ${s.steps.toLocaleString()} steps` +
        (s.limit === null ? ", with no limit (it ran until it was stopped)." : ` of the ${s.limit.toLocaleString()} it was set to run.`);
    case "mode":
      return run.mode === "manual" ? "Manual: you turned the knobs by hand (at the end)." :
        "Auto: the world turned its own knobs (at the end): harder when many and well fed, easier when few or hungry.";
    case "saves":
      return `This world saved itself ${run.saves} time${run.saves === 1 ? "" : "s"} (every 2,000 steps, and when it stopped). ` +
        `Open it to resume from any save.`;
  }
  return "";
}

const tipped = (what, text, s, run, cls = "") => `<span data-tip="${explain(what, s, run).replace(/"/g, "&quot;")}" class="${cls}">${text}</span>`;
const tone = (good, bad) => good ? "good" : bad ? "bad" : "";

function historyRow(run, best) {
  const s = scores(run);
  const row = document.createElement("div");
  row.className = "row" + (run.name === picked ? " picked" : "");
  row.innerHTML = `
    <div><b>${swatch(run.kind)}${title(run)}</b>${best ? '<span class="mark">Smartest</span>' : ""}<small>${run.started.replace("T", " ").slice(0, 16)}</small></div>
    <div class="num">${tipped("steps", thousands(s.steps), s, run)}</div>
    <div class="num">${tipped("hardest", `<strong>${fmt(s.hardest)}</strong>`, s, run)}${s.ended !== null && s.ended < s.hardest - 0.05 ? `<small>ended ${fmt(s.ended)}</small>` : ""}</div>
    <div class="num">${tipped("smart", `<strong>${s.smart === null ? "-" : two(s.smart) + "×"}</strong>`, s, run, tone(s.smart >= 1, s.smart !== null && s.smart < 1))}${s.smartWas !== null ? `<small>was ${two(s.smartWas)}×</small>` : ""}</div>
    <div class="num">${tipped("steer", `<strong>${two(s.steer)}</strong>`, s, run, tone(s.steer >= 0.2, s.steer !== null && s.steer < 0))}</div>
    <div class="num">${tipped("generation", s.generation === null ? "-" : s.generation, s, run)}</div>
    <div class="num">${s.alive === null ? "-" : tipped("end", `${s.alive} · ${s.fed} %`, s, run, tone(false, s.alive < 30 || s.fed < 35))}</div>
    <div>${tipped("mode", run.mode === "manual" ? "Manual" : "Auto", s, run)}</div>
    <div class="num">${tipped("saves", run.saves, s, run)}</div>`;
  row.addEventListener("click", () => { picked = run.name; render(); });
  return row;
}

function shown(past) {
  const kept = past.filter((run) => {
    const sc = scores(run);
    return (hist.animals === "all" || run.kind.split("-")[0] === hist.animals)
      && (hist.mode === "all" || run.mode === hist.mode)
      && sc.steps >= hist.minSteps
      && (!hist.smarter || (sc.smart !== null && sc.smart > 1))
      && (!hist.withSaves || run.saves > 0);
  });
  const column = COLUMNS.find((c) => c.key === hist.sort) || COLUMNS[3];
  const value = (run) => column.by(run, scores(run));
  return kept.sort((a, b) => {  // worlds with nothing to sort by go last, whichever way
    const x = value(a), y = value(b);
    if (x === null || x === undefined) return 1;
    if (y === null || y === undefined) return -1;
    const order = x < y ? -1 : x > y ? 1 : 0;
    return hist.desc ? -order : order;
  });
}

function historyTable(past) {
  const smartest = past.reduce((best, run) => {
    const smart = scores(run).smart;
    return smart !== null && (best === null || smart > best.smart) ? { name: run.name, smart } : best;
  }, null);
  const rows = shown(past);
  const options = (pairs, chosen) => pairs.map(([value, words]) =>
    `<option value="${value}"${String(value) === String(chosen) ? " selected" : ""}>${words}</option>`).join("");
  const filtered = JSON.stringify({ ...NO_FILTERS, ...Object.fromEntries(Object.keys(NO_FILTERS).map((k) => [k, hist[k]])) })
    !== JSON.stringify(NO_FILTERS);
  const box = document.createElement("div");
  box.innerHTML = `<div class="bar">
      <label>Sort <select data-f="shortcut">${options([["", "by column"], ...Object.entries(SHORTCUTS)],
        hist.desc && SHORTCUTS[hist.sort] ? hist.sort : "")}</select></label>
      <label>Animals <select data-f="animals">${options([["all", "all"], ["learning", "learning"], ["instinct", "instinct"]], hist.animals)}</select></label>
      <label>Mode <select data-f="mode">${options([["all", "all"], ["auto", "Auto"], ["manual", "Manual"]], hist.mode)}</select></label>
      <label>At least <select data-f="minSteps">${options(STEP_FLOORS.map((n) => [n, n ? `${thousands(n)} steps` : "any steps"]), hist.minSteps)}</select></label>
      <label><input type="checkbox" data-f="smarter"${hist.smarter ? " checked" : ""}> Only smarter than random</label>
      <label><input type="checkbox" data-f="withSaves"${hist.withSaves ? " checked" : ""}> Only with saves</label>
    </div>
    <div class="bar"><span>Showing ${rows.length} of ${past.length} worlds</span>
      ${filtered ? '<button type="button" class="act" data-f="clear">Clear filters</button>' : ""}
      <span>${Object.values(KIND_WORDS).join(" · ")}</span><span>Point at any number to see what it means.</span></div>`;
  box.querySelectorAll("[data-f]").forEach((control) => control.addEventListener(control.tagName === "BUTTON" ? "click" : "change", () => {
    const f = control.dataset.f;
    if (f === "clear") Object.assign(hist, NO_FILTERS);
    else if (f === "shortcut") { if (control.value) Object.assign(hist, { sort: control.value, desc: true }); }
    else if (control.type === "checkbox") hist[f] = control.checked;
    else hist[f] = f === "minSteps" ? Number(control.value) : control.value;
    keep();
    render();
  }));
  const table = document.createElement("div");
  table.className = "table";
  const head = document.createElement("div");
  head.className = "row head";
  for (const column of COLUMNS) {
    const title = document.createElement("button");
    title.type = "button";
    title.className = "sort";
    title.textContent = column.label + (hist.sort === column.key ? (hist.desc ? " ↓" : " ↑") : "");
    title.addEventListener("click", () => {
      hist.desc = hist.sort === column.key ? !hist.desc : true;  // a second click reverses it
      hist.sort = column.key;
      keep();
      render();
    });
    head.append(title);
  }
  table.append(head, ...rows.map((run) => historyRow(run, smartest && run.name === smartest.name)));
  if (!rows.length) table.insertAdjacentHTML("beforeend", '<div class="empty">No world matches these filters.</div>');
  box.append(table);
  return box;
}

document.addEventListener("mouseover", (event) => {  // every number explains itself
  const tip = document.getElementById("tip"), target = event.target.closest("[data-tip]");
  if (!target) { tip.style.display = "none"; return; }
  tip.textContent = target.dataset.tip;
  tip.style.display = "block";
  const box = target.getBoundingClientRect();
  tip.style.left = `${Math.max(8, Math.min(box.left, innerWidth - tip.offsetWidth - 8))}px`;
  tip.style.top = `${box.bottom + 6 + tip.offsetHeight > innerHeight ? box.top - tip.offsetHeight - 6 : box.bottom + 6}px`;
});

// ---- Rules: every cost, value and gene of the running world, each changeable at once ----
const RULE_GROUPS = { costs: "energy a creature pays (a bite of food gives 1)", genes: "new limits apply to babies born from now on",
                      exam: "changing the exam makes older scores incomparable" };
const AUTO_COSTS = [
  ["step_cost", "Being alive, each step, × size", "Energy it pays every step just for being alive. A bigger creature pays more."],
  ["move_cost", "Moving, per unit of distance, × size", "Energy it pays for each unit it moves. A bigger creature pays more."],
];
const numberText = (v) => Math.abs(v) >= 100 ? String(Math.round(v * 10) / 10) : String(Number(v.toPrecision(4)));

function ruleInput(rule) {  // one number box: a rule of the world, or one of Auto's two cost knobs
  return `<input type="number" step="any" data-rule="${rule.name}"${rule.knob ? ' data-knob="1"' : ""} value="${numberText(rule.value)}"
    data-tip="${rule.words}: from ${numberText(rule.low)} to ${numberText(rule.high)}; a new world starts at ${numberText(rule.start)}"
    aria-label="${rule.words}">`;
}

// What a rule works out to for a creature of size s (v: the rule's value, r: every value now), as the world computes it.
const WORKS_OUT = {
  tank: (v, s) => `holds ${(v * s).toFixed(0)} energy`,
  body_radius: (v, s) => `${(2 * v * s).toFixed(2)} wide`,
  cruise_speed: (v, s) => `moves ${(v / s).toFixed(2)} a step`,
  sprint_speed: (v, s, r) => `bursts up to ${Math.max(r.cruise_speed / s, v * Math.sqrt(s)).toFixed(2)} a step`,
  attack_cost: (v, s) => `pays ${(v * s).toFixed(2)} an attack`,
  attack_damage: (v, s) => `takes ${(v * s).toFixed(1)} from the one it hits`,
  corpse_energy: (v, s) => `leaves ${(v * s).toFixed(1)} food when it dies`,
  step_cost: (v, s) => `pays ${(v * s).toFixed(3)} a step`,
  move_cost: (v, s) => `pays ${(v * s).toFixed(3)} a unit moved`,
};
const GENE_NOW = { size: "size", vision_width: "vision_width", vision_reach: "vision_reach", hearing: "hearing",
                   fear: "fear_of_death", love: "love_of_babies", learns: "learns_from_others", neurons: "neurons",
                   mutations: "mutations", mutation_size: "mutation_size" };
let ruleNow = { sizes: null, genes: null, values: {} };  // the creatures alive now and the rules' values, for the examples

function example(rule) {  // the line under a rule's meaning: what it is for the smallest and the biggest creature now
  const works = WORKS_OUT[rule.name];
  if (!works || !ruleNow.sizes) return "";
  const [small, big] = ruleNow.sizes;
  return `Now: the smallest (size ${small.toFixed(2)}) ${works(rule.value, small, ruleNow.values)} · the biggest (size ${big.toFixed(2)}) ${works(rule.value, big, ruleNow.values)}`;
}

function geneExample(gene) {  // the line under a gene's meaning: its spread among the living now
  const g = ruleNow.genes && ruleNow.genes[GENE_NOW[gene]];
  return g ? `Now: lowest ${numberText(g[0])} · average ${numberText(g[1])} · highest ${numberText(g[2])}` : "";
}

const meaningCell = (text, key, line) => `<td class="means">${text}<small class="meaning" data-example="${key}">${line}</small></td>`;

function ruleRow(rule) {
  return `<tr><td class="name">${rule.words}${rule.knob ? '<span class="auto" data-tip="Auto moves this while the world is on Auto; your change holds on Manual">Auto</span>' : ""}</td>
    ${meaningCell(rule.means, rule.name, example(rule))}
    <td>${ruleInput(rule)}<span class="error"></span></td><td>${numberText(rule.low)} – ${numberText(rule.high)}</td>
    <td>${numberText(rule.start)}</td><td><button class="act" type="button" data-reset="${rule.name}">Reset</button></td></tr>`;
}

function geneRows(rules, means) {  // one row a gene: what it is, lowest – highest, what a newcomer gets
  const genes = [...new Set(rules.map((r) => r.name.split(".")[1]))];
  return genes.map((gene) => {
    const own = (part) => rules.find((r) => r.name === `gene.${gene}.${part}`);
    const box = (part) => own(part) ? `${ruleInput(own(part))}` : "";
    const newcomer = own("start") ? box("start") : `${box("new_low")} – ${box("new_high")}`;
    return `<tr><td class="name">${own("low").words.split(":")[0]}</td>${meaningCell(means[gene] || "", `gene.${gene}`, geneExample(gene))}
      <td>${box("low")} – ${box("high")}</td><td>${newcomer}<span class="error"></span></td></tr>`;
  }).join("");
}

async function drawRules() {
  const page = document.getElementById("rules-page"), run = data.find((r) => r.status === "running");
  if (!run) { page.dataset.run = ""; page.innerHTML = '<div class="nothing"><b>Nothing is running</b>Start a world to see and change its rules.</div>'; return; }
  const answer = await (await fetch(`/rules?run=${encodeURIComponent(run.name)}`, { cache: "no-store" })).json();
  const now = await (await fetch(`/now?run=${encodeURIComponent(run.name)}`, { cache: "no-store" })).json().catch(() => null);
  const genes = now && now.genes;
  ruleNow = { sizes: genes && genes.size ? [genes.size[0], genes.size[2]] : null, genes,
              values: Object.fromEntries(answer.rules.map((r) => [r.name, r.value])) };
  const last = lastRow(run) || {};
  const autoCosts = AUTO_COSTS.map(([name, words, means]) => {
    const knob = KNOBS.find((k) => k.name === name);
    return { name, words, means, knob: true, value: last[name] ?? knob.start, start: knob.start,
             low: Math.min(knob.easiest, knob.hardest), high: Math.max(knob.easiest, knob.hardest) };
  });
  const rules = [...autoCosts, ...answer.rules];
  if (page.dataset.run === run.name) {  // already drawn: only the values and the examples move, never the box being typed in
    for (const rule of rules) {
      const input = page.querySelector(`input[data-rule="${rule.name}"]`);
      if (input && input !== document.activeElement) input.value = numberText(rule.value);
      const line = page.querySelector(`[data-example="${rule.name}"]`);
      if (line) line.textContent = example(rule);
    }
    page.querySelectorAll('[data-example^="gene."]').forEach((line) => { line.textContent = geneExample(line.dataset.example.slice(5)); });
    return;
  }
  page.dataset.run = run.name;
  page.innerHTML = answer.groups.map(({ name, title }) => {
    const mine = rules.filter((r) => (r.knob ? "costs" : r.group) === name);
    const genes = name === "genes", geneRules = mine.filter((r) => r.name.split(".").length === 3 && !r.name.startsWith("gene.weights"));
    const head = genes ? "<tr><th>Gene</th><th>What it means</th><th>Lowest – highest</th><th>Newcomer gets</th></tr>"
                       : `<tr><th>${name === "costs" ? "Cost" : "Rule"}</th><th>What it means</th><th>Value</th><th>Allowed</th><th>Start</th><th></th></tr>`;
    const body = genes ? geneRows(geneRules, answer.genes) + mine.filter((r) => r.name.startsWith("gene.weights")).map(ruleRow).join("")
                       : mine.map(ruleRow).join("");
    return `<div class="rules-table"><h2>${title}<small>${RULE_GROUPS[name] || ""}</small></h2><table>${head}${body}</table></div>`;
  }).join("");
  const change = async (name, value, knob, where) => {
    const error = where.closest("td").querySelector(".error");
    try {
      await send("/control", knob ? { run: run.name, settings: { [name]: value } } : { run: run.name, rules: { [name]: value } });
      say(error, "", "");
    } catch (problem) {
      say(error, problem.message, "refused");
    }
  };
  page.querySelectorAll("input[data-rule]").forEach((input) => input.addEventListener("change", () =>
    change(input.dataset.rule, Number(input.value), !!input.dataset.knob, input)));
  page.querySelectorAll("button[data-reset]").forEach((button) => button.addEventListener("click", () => {
    const rule = rules.find((r) => r.name === button.dataset.reset), input = page.querySelector(`input[data-rule="${rule.name}"]`);
    input.value = numberText(rule.start);
    change(rule.name, rule.start, !!rule.knob, input);
  }));
}

function render() {
  for (const name of ["live", "history", "rules"]) document.getElementById(`tab-${name}`).classList.toggle("on", view === name);
  const live = view === "live", rulesView = view === "rules";
  document.getElementById("rules-page").hidden = !rulesView;
  document.getElementById("charts").hidden = rulesView;
  if (rulesView) {
    for (const id of ["start", "worlds", "runs"]) document.getElementById(id).hidden = true;
    if (watching) jumpOut();
    return drawRules();
  }
  document.getElementById("start").hidden = !live;
  document.getElementById("worlds").hidden = !live;
  if (!live && watching) jumpOut();
  document.getElementById("runs").hidden = live;
  if (live) {
    const running = data.filter((run) => run.status === "running");
    drawWorlds(running);
    if (!running.length) return message("Nothing is running", "Start a world above. Past runs are in History.");
    return drawCharts(running);
  }
  const past = data.filter((run) => run.status !== "running");
  document.getElementById("runs").replaceChildren(historyTable(past));
  if (!past.length) return message("No past runs yet", "A run appears here when it ends.");
  const chosen = past.find((run) => run.name === picked);
  if (!chosen) return message("Pick a run", "Click a run above to see its charts and its saves. To carry on a paused world, press Continue on it in Live.");
  drawCharts([chosen]);
  const bar = document.createElement("div");
  bar.id = "resume-bar";
  bar.append(resumePicker(chosen, (problem) => { if (problem) alert(problem.message); }));
  document.getElementById("charts").prepend(bar);
}

function show(next) {
  view = next;
  history.replaceState(null, "", next === "live" ? "#" : `#${next}`);
  render();
}
document.getElementById("tab-live").addEventListener("click", () => show("live"));
document.getElementById("tab-history").addEventListener("click", () => show("history"));
document.getElementById("tab-rules").addEventListener("click", () => show("rules"));

for (const button of document.querySelectorAll("#start-mode button"))
  button.addEventListener("click", () => {
    startMode = button.dataset.mode;
    for (const other of document.querySelectorAll("#start-mode button")) other.classList.toggle("on", other === button);
  });
document.getElementById("start-go").addEventListener("click", async () => {
  const error = document.getElementById("start-error"), go = document.getElementById("start-go");
  go.disabled = true;
  try {
    await send("/start", { species: document.getElementById("start-species").value,
                           seed: Number(document.getElementById("start-seed").value), mode: startMode });
    say(error, "Starting… the first numbers come after 250 steps.", "starting");
    signature = "";
    await poll();
  } catch (problem) {
    say(error, problem.message, "refused");
  } finally {
    go.disabled = data.filter((run) => run.status === "running").length >= 2;
  }
});

async function poll() {
  const clock = document.getElementById("clock");
  try {
    const next = await (await fetch("/data", { cache: "no-store" })).json();
    for (const run of next) run.rows.forEach((row, i) => {
      const gap = row.step - (i ? run.rows[i - 1].step : 0);  // rows every 250 steps (every 1,000 in older runs)
      row.deaths = (row.deaths_hunger + row.deaths_attack + row.deaths_age) * 1000 / gap;
      row.energy_percent = row.energy === null ? null : row.energy * 100;
      row.attacks_rate = row.attacks === null ? null : row.attacks * 1000 / gap;
    });
    const now = JSON.stringify(next.map((r) => [r.name, r.rows.length, r.status, r.mode, r.paused]));
    if (now !== signature) { signature = now; data = next; lastChange = Date.now(); render(); }
    const running = next.filter((run) => run.status === "running").length;
    const ago = Math.round((Date.now() - lastChange) / 1000);
    clock.innerHTML = running
      ? `<i class="dot"></i>${running} running · last new data ${ago < 5 ? "just now" : ago + " s ago"}`
      : '<i class="dot stale"></i>nothing running';
  } catch (error) {
    clock.innerHTML = '<i class="dot stale"></i>viewer server not reachable';
  }
}

(async () => {
  try { KNOBS = (await (await fetch("/knobs")).json()).knobs; } catch (error) { KNOBS = []; }
  render();
  await poll();
  setInterval(poll, 2000);
})();
</script>
</body>
</html>
